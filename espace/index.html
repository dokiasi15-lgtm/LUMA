<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#254d45"><title>Espace Dolivin — avancer à votre rythme</title>
<style>
:root{--bg:#f6f7f2;--ink:#203c36;--muted:#75847b;--green:#254d45;--lime:#d9ef9c;--line:#e4e8df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button,a{touch-action:manipulation}button{cursor:pointer}a{color:inherit}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}aside{padding:32px 22px;background:#fff;border-right:1px solid var(--line)}.brand{font-size:23px;font-weight:800;letter-spacing:-1px}.brand i{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--green);color:var(--lime);border-radius:12px;font-style:normal;margin-right:8px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-weight:700}nav{display:grid;gap:7px;margin:38px 0}nav a{text-decoration:none;padding:13px;border-radius:12px;color:var(--muted);font-weight:600}nav a.active{background:var(--green);color:white}nav a:hover{background:#e9eee5;color:var(--ink)}.side-note{padding:18px;border-radius:18px;background:#f2f5ec;font-size:12px;line-height:1.7}.side-note a{display:block;font-weight:700;margin-top:8px}main{padding:30px 4vw 60px;max-width:1500px;width:100%;margin:auto}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:30px}.avatar{background:#e6ebdb;border-radius:50%;padding:12px;font-weight:700}h1{font-size:clamp(27px,3vw,40px);letter-spacing:-1.5px;margin:12px 0}h2{font-size:20px;letter-spacing:-.5px;margin:0 0 15px}h3{margin:0 0 8px;font-size:16px}p{line-height:1.65}.muted{color:var(--muted)}.hero{background:var(--green);color:white;padding:32px;border-radius:25px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin:24px 0}.hero p{color:#d1ded1;margin-bottom:0}.hero .eyebrow{color:var(--lime)}.hero-art{font-size:65px;color:var(--lime);font-family:Georgia;line-height:.9}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.two{grid-template-columns:1.4fr 1fr}.card{background:#fff;border:1px solid var(--line);padding:23px;border-radius:20px;margin-bottom:18px;min-width:0}.stat{font-size:34px;font-weight:700;letter-spacing:-1px;margin-top:10px}.row{display:flex;align-items:center;gap:12px;justify-content:space-between}.wrap{flex-wrap:wrap}.pill{font-size:11px;padding:5px 10px;border-radius:20px;background:#edf2e5;color:#4c6a42;white-space:nowrap}.btn{border:0;background:var(--green);color:white;padding:11px 16px;border-radius:10px;text-decoration:none;display:inline-block;font-weight:600}.btn.light{background:#edf2e5;color:var(--ink)}.btn.lime{background:var(--lime);color:var(--ink)}.btn.danger{background:#fff0eb;color:#9b453d}.mini{padding:7px 11px;font-size:12px}.toolbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}input,select,textarea{padding:11px 12px;border:1px solid #d8dfd4;border-radius:10px;background:#fff;color:var(--ink);max-width:100%;width:100%}textarea{min-height:110px;resize:vertical}label{display:grid;gap:7px;font-size:13px;font-weight:600;margin-bottom:16px}.item{padding:16px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.item small{color:var(--muted)}.check{width:20px;height:20px;flex-shrink:0}.done{text-decoration:line-through;color:var(--muted)}.empty{text-align:center;padding:28px 15px;color:var(--muted);line-height:1.8}.empty b{display:block;color:var(--ink);font-size:17px}.progress{height:7px;background:#edf0e8;border-radius:8px;overflow:hidden;margin-top:12px}.progress span{display:block;background:#8faf61;height:100%}.clock{font-size:78px;font-weight:650;letter-spacing:-4px;font-variant-numeric:tabular-nums;text-align:center;margin:32px 0}.center{text-align:center}.flash{padding:40px 22px;min-height:220px;display:grid;place-items:center;font-size:23px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6ee;border-radius:17px;cursor:pointer}.bars{height:140px;display:flex;gap:12px;align-items:flex-end;padding-top:10px}.barcol{flex:1;text-align:center;font-size:10px;color:var(--muted)}.bar{background:#a8c28e;border-radius:7px 7px 0 0;min-height:3px;width:65%;margin:auto auto 8px}dialog{border:0;border-radius:22px;max-width:560px;width:calc(100% - 28px);padding:28px;color:var(--ink);max-height:90vh;overflow:auto}dialog::backdrop{background:#172e2880}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:13px 22px;border-radius:12px;z-index:20;max-width:90vw}footer{font-size:11px;color:var(--muted);margin-top:30px}.link-card{display:block;text-decoration:none;transition:transform .15s}.link-card:hover{transform:translateY(-3px)}.number{font-family:Georgia,serif;font-size:36px;color:#7f9e60}.subject-dot{width:10px;height:10px;background:#aac38b;border-radius:50%;display:inline-block;margin-right:8px}.tab{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 14px;border-radius:20px}.tab.selected{background:var(--green);color:white}.note-title{max-width:90%;overflow-wrap:anywhere}.quiz-answer{width:100%;text-align:left;margin:7px 0}.notice{padding:14px;background:#f6f0da;border-radius:12px;font-size:13px;line-height:1.6}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.shell{grid-template-columns:190px 1fr}aside{padding:25px 12px}.hero-art{display:none}}@media(max-width:650px){.shell{display:block}aside{padding:16px;border:0;position:relative}.brand{font-size:20px}nav{display:flex;overflow:auto;margin:15px 0 0;gap:5px}nav a{white-space:nowrap;padding:10px;font-size:13px}.side-note{display:none}main{padding:20px 16px 45px}header{margin-bottom:22px;padding-bottom:16px}.grid{grid-template-columns:1fr}.hero{padding:24px}.card{padding:19px}.clock{font-size:68px}.row{gap:8px}h1{letter-spacing:-1px}.stat{font-size:30px}}
</style></head><body><div class="shell"><aside><div class="brand"><i>D</i>dolivin<span style="color:#99b580">.</span></div><nav id="nav"></nav><div class="side-note"><b>Une chose à la fois.</b><br>Vos idées ont leur place. Vos petits progrès aussi.<a href="https://dokiasi15-lgtm.github.io/LUMA/" target="_blank" rel="noopener">Ouvrir Luma ↗</a></div></aside><main><header><div><div class="eyebrow">Votre espace personnel</div><div id="date" class="muted" style="margin-top:7px"></div></div><div class="avatar">DK</div></header><section id="view"></section><footer>Enregistré dans ce navigateur · Sans synchronisation entre appareils · Pensez à exporter une sauvegarde.</footer></main></div><dialog id="modal"></dialog><div id="toast" hidden role="status"></div>
<script>
'use strict';
const KEY='dolivin-espace-v1',DAY=86400000,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID(),today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},blank=()=>({version:1,tasks:[],subjects:[],cards:[],notes:[],projects:[],events:[],sessions:[]});let state=blank(),storageOK=true;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);validate(parsed);state=parsed}}catch(e){storageOK=false}
function validate(s){if(!s||s.version!==1)throw Error('Format de sauvegarde non reconnu.');for(const k of ['tasks','subjects','cards','notes','projects','events','sessions']){if(!Array.isArray(s[k])||s[k].length>10000)throw Error('Liste invalide : '+k);for(const v of s[k])if(!v||typeof v!=='object'||typeof v.id!=='string')throw Error('Élément invalide.')}for(const t of s.tasks)if(typeof t.title!=='string'||typeof t.done!=='boolean')throw Error('Tâche invalide.');for(const c of s.cards)if(typeof c.question!=='string'||typeof c.answer!=='string'||!Number.isFinite(c.level)||!Number.isFinite(c.due))throw Error('Fiche invalide.');for(const n of s.notes)if(typeof n.title!=='string'||typeof n.body!=='string')throw Error('Note invalide.');for(const p of s.projects)if(typeof p.title!=='string'||!['idee','cours','fini'].includes(p.status))throw Error('Projet invalide.');for(const x of s.subjects)if(typeof x.name!=='string')throw Error('Matière invalide.');for(const e of s.events)if(typeof e.title!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(e.date))throw Error('Échéance invalide.');for(const x of s.sessions)if(typeof x.date!=='string'||!Number.isFinite(x.minutes)||x.minutes<0)throw Error('Séance invalide.');}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;return true}catch(e){storageOK=false;toast('Sauvegarde impossible. Exportez vos données avant de fermer.');return false}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>$('#toast').hidden=true,4500)}
const routes=[['accueil','◈','Mon tableau de bord'],['etudes','▤','Mes études'],['planning','▦','Planning & tâches'],['projets','◇','Mes projets'],['notes','✎','Notes & idées'],['focus','◷','Concentration'],['outils','⊞','Mes outils'],['reglages','⚙','Sauvegardes']];let tab='matieres',review=null,quiz=null;let timer={end:0,left:1500,running:false,minutes:25,mode:'Travail',subject:''};
function route(){return routes.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'accueil'}function subjectName(id){return state.subjects.find(x=>x.id===id)?.name||'Général'}function options(selected=''){return '<option value="">Général</option>'+state.subjects.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===selected?'selected':'')+'>'+esc(s.name)+'</option>').join('')}function empty(t,b){return '<div class="empty"><b>'+t+'</b>'+b+'</div>'}function heading(k,t,sub){return '<div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="muted">'+sub+'</p>'}function button(action,label,cls=''){return '<button class="btn '+cls+'" data-action="'+action+'">'+label+'</button>'}function countDone(){return state.tasks.filter(t=>t.done).length}function dateLabel(s){return s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'Sans échéance'}
function render(){const r=route();$('#nav').innerHTML=routes.map(([id,ico,title])=>'<a class="'+(r===id?'active':'')+'" href="#'+id+'">'+ico+' &nbsp;'+title+'</a>').join('');$('#date').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});$('#view').innerHTML=(!storageOK?'<p class="notice">Le stockage du navigateur est indisponible ou une sauvegarde est illisible. Exportez vos données avant de fermer. Aucune ancienne sauvegarde n’a été volontairement effacée.</p>':'')+views[r]();if(r==='focus')tick()}
function taskRow(t){return '<div class="item row"><input class="check" type="checkbox" aria-label="Terminer '+esc(t.title)+'" data-task="'+esc(t.id)+'" '+(t.done?'checked':'')+'><div style="flex:1;min-width:0"><b class="'+(t.done?'done':'')+'">'+esc(t.title)+'</b><br><small>'+esc(subjectName(t.subject))+' · '+dateLabel(t.date)+(t.priority==='haute'?' · Prioritaire':'')+'</small></div><button class="btn light mini" data-edit="tasks:'+t.id+'" aria-label="Modifier la tâche">✎</button></div>'}
const views={
accueil(){const active=state.tasks.filter(t=>!t.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));const mins=state.sessions.filter(s=>s.date===today()).reduce((n,s)=>n+s.minutes,0);const due=state.cards.filter(c=>c.due<=Date.now()).length;return heading('Votre point de départ','Bonjour, Dolivin.','Un espace pour apprendre, créer et garder le cap.')+'<div class="hero"><div><div class="eyebrow">Chaque petit pas compte</div><h2 style="font-size:28px;margin:12px 0">Faites de la place à ce qui compte.</h2><p>'+(active[0]?'Votre prochaine étape : '+esc(active[0].title)+'.':'Choisissez une priorité et commencez par une petite action.')+'</p><div style="margin-top:20px">'+button('add-task','＋ Une nouvelle tâche','lime')+'</div></div><div class="hero-art">✳<br>↗</div></div><div class="grid">'+[['À faire',active.length,'tâches en attente'],['Révisions',due,'fiches à revoir'],['Concentration',mins+' min','de travail aujourd’hui']].map(([a,b,c])=>'<div class="card"><div class="muted">'+a+'</div><div class="stat">'+b+'</div><small class="muted">'+c+'</small></div>').join('')+'</div><div class="grid two"><div class="card"><div class="row"><h2>Mes prochaines actions</h2><a href="#planning">Tout voir ↗</a></div>'+active.slice(0,5).map(taskRow).join('')+(active.length?'':empty('L’esprit libre','Ajoutez votre première tâche pour préparer la suite.'))+'</div><div class="card"><h2>Votre rythme cette semaine</h2>'+weeklyChart()+'<p class="muted" style="font-size:12px">Minutes de concentration enregistrées, sur 7 jours.</p></div></div><div class="grid"><a class="card link-card" href="#etudes"><div class="number">01</div><h3>Apprendre un peu chaque jour</h3><p class="muted">Matières, fiches et quiz pour réviser activement.</p></a><a class="card link-card" href="https://dokiasi15-lgtm.github.io/LUMA/" target="_blank" rel="noopener"><div class="number">02</div><h3>Garder le budget clair ↗</h3><p class="muted">Retrouvez vos comptes et vos objectifs dans Luma.</p></a><a class="card link-card" href="#projets"><div class="number">03</div><h3>Donner vie à vos idées</h3><p class="muted">Films, sites, études : un endroit pour avancer.</p></a></div>'},
etudes(){return heading('Apprendre & progresser','Vos études, à votre rythme.','Organisez vos matières, écrivez vos fiches et entraînez votre mémoire.')+'<div class="toolbar">'+[['matieres','Matières'],['fiches','Fiches de révision'],['quiz','Quiz']].map(([id,t])=>'<button class="tab '+(tab===id?'selected':'')+'" data-tab="'+id+'">'+t+'</button>').join('')+'</div>'+({matieres:subjectsView,fiches:cardsView,quiz:quizView}[tab])()},
planning(){const pending=state.tasks.filter(t=>!t.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return heading('Organiser sa semaine','Moins de flou. Plus d’élan.','Devoirs, rendez-vous et priorités : choisissez votre prochaine action.')+'<div class="toolbar">'+button('add-task','＋ Ajouter une tâche')+button('add-event','＋ Ajouter une échéance','light')+'</div><div class="grid two"><div class="card"><h2>À faire · '+pending.length+'</h2>'+pending.map(taskRow).join('')+(pending.length?'':empty('Tout est à jour','Ajoutez un devoir, une course ou une tâche personnelle.'))+'<details style="margin-top:20px"><summary>Terminées · '+countDone()+'</summary>'+state.tasks.filter(t=>t.done).map(taskRow).join('')+'</details></div><div class="card"><h2>Échéances & examens</h2>'+[...state.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>'<div class="item"><div class="row"><span class="pill">'+dateLabel(e.date)+'</span><button class="btn light mini" data-edit="events:'+e.id+'">Modifier</button></div><h3 style="margin-top:12px">'+esc(e.title)+'</h3><small>'+esc(subjectName(e.subject))+(e.date<today()?' · Date passée':'')+'</small><p class="muted">'+esc(e.body)+'</p></div>').join('')+(state.events.length?'':empty('Anticipez la suite','Ajoutez votre prochain examen ou rendez-vous.'))+'</div></div>'},
projets(){return heading('Créer & entreprendre','Une idée. Puis un premier pas.','Suivez vos créations, vos projets d’études et vos activités au même endroit.')+'<div class="toolbar">'+button('add-project','＋ Nouveau projet')+'</div><div class="grid">'+[['idee','À imaginer'],['cours','En cours'],['fini','Terminés']].map(([status,t])=>'<div class="card"><h2>'+t+' <span class="pill">'+state.projects.filter(p=>p.status===status).length+'</span></h2>'+state.projects.filter(p=>p.status===status).map(p=>'<div class="item"><small>'+esc(p.kind)+'</small><h3 style="margin-top:8px">'+esc(p.title)+'</h3><p class="muted">'+esc(p.body)+'</p><small>'+dateLabel(p.date)+'</small><div style="margin-top:12px"><button class="btn light mini" data-edit="projects:'+p.id+'">Ouvrir / modifier</button></div></div>').join('')+'</div>').join('')+'</div>'},
notes(){return heading('Capturer & retrouver','Ne laissez pas filer vos idées.','Cours, idées de films, brouillons et pensées : gardez une trace.')+'<div class="toolbar">'+button('add-note','＋ Nouvelle note')+'</div><label>Rechercher dans vos notes<input id="note-search" placeholder="Un titre, une phrase, une idée…" type="search"></label><div id="note-list" class="grid">'+noteList('')+'</div>'},
focus(){return heading('Une chose à la fois','Votre moment de concentration.','Une séance courte, un objectif clair, puis une vraie pause.')+'<div class="grid two"><div class="card center"><div class="toolbar" style="justify-content:center">'+[['Travail',25],['Pause',5],['Longue pause',15]].map(([name,n])=>'<button class="tab '+(timer.mode===name?'selected':'')+'" data-duration="'+n+'" data-mode="'+name+'">'+name+'</button>').join('')+'</div><label style="max-width:300px;margin:20px auto;text-align:left">Matière de la séance<select id="focus-subject" '+(timer.running?'disabled':'')+'>'+options(timer.subject)+'</select></label><div class="clock" id="clock">25:00</div><div class="toolbar" style="justify-content:center">'+button('timer-toggle',timer.running?'Mettre en pause':'Commencer')+button('timer-reset','Recommencer','light')+'</div><p class="muted">Les séances de travail complètes sont enregistrées.<br>Gardez cet onglet ouvert jusqu’à la fin.</p></div><div class="card"><h2>Vos dernières séances</h2>'+state.sessions.slice(-8).reverse().map(s=>'<div class="item row"><span>'+esc(subjectName(s.subject))+'<br><small>'+dateLabel(s.date)+'</small></span><b>'+s.minutes+' min</b></div>').join('')+(state.sessions.length?'':empty('Votre rythme commence ici','Une première séance de 25 minutes suffit.'))+'</div></div>'},
outils(){return heading('Tout retrouver','Votre petite boîte à outils.','Vos outils utiles, sans vous disperser.')+'<div class="grid"><a class="card link-card" href="https://dokiasi15-lgtm.github.io/LUMA/" target="_blank" rel="noopener"><span class="number">↗</span><h2>Luma Budget</h2><p class="muted">Budget en CDF, comptes, dépenses, épargne et projections. Votre budget reste dans Luma.</p><span class="pill">Ouvrir Luma</span></a><a class="card link-card" href="#etudes"><span class="number">▤</span><h2>Révisions actives</h2><p class="muted">Fiches recto verso, rappels espacés et quiz créés avec vos propres réponses.</p></a><a class="card link-card" href="#focus"><span class="number">◷</span><h2>Concentration</h2><p class="muted">Séances de travail, pauses et historique par matière.</p></a></div><div class="card"><h2>Calculer une moyenne pondérée</h2><p class="muted">Une ligne par note : note / maximum ; coefficient. Exemple : 14 / 20 ; 2</p><label>Vos notes<textarea id="grades" placeholder="14 / 20 ; 2&#10;16 / 20 ; 1"></textarea></label>'+button('average','Calculer la moyenne')+'<p id="average-result" role="status"></p></div>'},
reglages(){return heading('Vos données','Gardez une copie, gardez la main.','Les informations d’Espace Dolivin sont conservées dans ce navigateur.')+'<div class="grid two"><div class="card"><h2>Sauvegarder & transférer</h2><p class="muted">Exportez votre espace pour le conserver ou l’importer sur un autre appareil. Il n’y a pas de synchronisation automatique.</p><div class="toolbar">'+button('export','↓ Exporter mon espace')+'<label class="btn light" style="margin:0;cursor:pointer">↑ Importer une copie<input type="file" id="import" accept=".json,application/json" hidden></label></div><p class="notice">Une importation remplace le contenu actuel de cet espace après confirmation. Les sauvegardes de Luma s’exportent et s’importent directement dans Luma.</p></div><div class="card"><h2>Confidentialité</h2><p class="muted">Aucun compte requis. Vos notes et tâches ne sont pas envoyées à GitHub par cette application. Elles ne sont pas chiffrées : protégez l’accès à votre appareil.</p><p class="muted">Effacer les données du navigateur peut effacer votre espace. Évitez la navigation privée et conservez une sauvegarde dans un endroit privé.</p></div></div>'}
};
function weeklyChart(){const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return {label:d.toLocaleDateString('fr-FR',{weekday:'short'}),n:state.sessions.filter(s=>s.date===key).reduce((a,b)=>a+b.minutes,0)}});const max=Math.max(60,...days.map(d=>d.n));return '<div class="bars" role="img" aria-label="'+days.map(d=>d.label+' '+d.n+' minutes').join(', ')+'">'+days.map(d=>'<div class="barcol"><div class="bar" title="'+d.n+' minutes" style="height:'+Math.max(3,d.n/max*100)+'px"></div>'+d.label+'</div>').join('')+'</div>'}
function subjectsView(){return '<div class="toolbar">'+button('add-subject','＋ Ajouter une matière')+'</div><div class="grid">'+state.subjects.map(s=>{const tasks=state.tasks.filter(t=>t.subject===s.id),done=tasks.filter(t=>t.done).length;return '<div class="card"><div class="row"><h2><span class="subject-dot"></span>'+esc(s.name)+'</h2><button class="btn light mini" data-edit="subjects:'+s.id+'">✎</button></div><p class="muted">'+esc(s.body)+'</p><div class="row"><small>'+state.cards.filter(c=>c.subject===s.id).length+' fiches</small><small>'+done+'/'+tasks.length+' tâches terminées</small></div><div class="progress"><span style="width:'+(tasks.length?100*done/tasks.length:0)+'%"></span></div></div>'}).join('')+(state.subjects.length?'':'<div class="card">'+empty('Qu’étudiez-vous en ce moment ?','Ajoutez votre première matière pour classer vos cours et vos fiches.')+'</div>')+'</div>'}
function cardsView(){if(review){const c=state.cards.find(c=>c.id===review.id);if(!c){review=null;return cardsView()}return '<div class="card"><div class="row"><h2>'+esc(subjectName(c.subject))+'</h2>'+button('review-stop','Quitter','light mini')+'</div><p class="muted">'+(review.revealed?'La réponse':'Essayez de répondre avant de retourner la fiche.')+'</p><div class="flash" tabindex="0" role="button" data-action="reveal">'+esc(review.revealed?c.answer:c.question)+'</div><div class="toolbar" style="margin-top:20px">'+(review.revealed?button('review-again','À revoir','light')+button('review-good','Je savais !'):button('reveal','Voir la réponse'))+'</div></div>'}const due=state.cards.filter(c=>c.due<=Date.now());return '<div class="toolbar">'+button('add-card','＋ Créer une fiche')+button('review-start','Réviser ('+due.length+' à revoir)','light')+'</div><div class="grid">'+state.cards.map(c=>'<div class="card"><div class="row"><span class="pill">'+esc(subjectName(c.subject))+'</span><button class="btn light mini" data-edit="cards:'+c.id+'">✎</button></div><h3 style="margin-top:15px">'+esc(c.question)+'</h3><p class="muted">'+(c.due<=Date.now()?'À revoir maintenant':'Prochaine révision : '+new Date(c.due).toLocaleDateString('fr-FR'))+'</p></div>').join('')+(state.cards.length?'':'<div class="card">'+empty('Une question, une réponse','Créez vos fiches à partir de vos cours. Les intervalles de révision progressent avec vos réussites.')+'</div>')+'</div>'}
function quizView(){if(!quiz)return '<div class="card"><h2>Testez ce que vous retenez</h2><p class="muted">Le quiz utilise vos propres fiches et mélange leurs réponses. Il faut au moins 4 fiches avec des réponses différentes. Les réponses sont celles que vous avez saisies, sans vérification automatique de leur exactitude.</p>'+button('quiz-start','Commencer un quiz')+'</div>';if(quiz.pos>=quiz.items.length)return '<div class="card center"><h2>Une étape de plus.</h2><div class="stat">'+quiz.score+' / '+quiz.items.length+'</div><p class="muted">Les réponses manquées sont disponibles immédiatement dans vos révisions.</p>'+button('quiz-start','Recommencer')+'</div>';const q=quiz.items[quiz.pos];return '<div class="card"><div class="row"><span class="pill">Question '+(quiz.pos+1)+' / '+quiz.items.length+'</span><small>'+quiz.score+' bonne(s) réponse(s)</small></div><h2 style="margin-top:22px">'+esc(q.question)+'</h2>'+quiz.choices.map((a,i)=>'<button class="btn light quiz-answer" data-answer="'+i+'" '+(quiz.answered?'disabled':'')+'>'+esc(a)+'</button>').join('')+(quiz.answered?'<p role="status">'+(quiz.correct?'Bonne réponse.':'La réponse attendue : '+esc(q.answer))+'</p>'+button('quiz-next','Continuer'):'')+'</div>'}
function noteList(q){const list=state.notes.filter(n=>(n.title+' '+n.body).toLocaleLowerCase().includes(q.toLocaleLowerCase()));return list.map(n=>'<div class="card"><span class="pill">'+esc(n.kind||'Note')+'</span><h2 class="note-title" style="margin-top:16px">'+esc(n.title)+'</h2><p style="white-space:pre-wrap;overflow-wrap:anywhere" class="muted">'+esc(n.body.slice(0,260))+(n.body.length>260?'…':'')+'</p><button class="btn light mini" data-edit="notes:'+n.id+'">Lire / modifier</button></div>').join('')||'<div class="card">'+empty(q?'Aucune note trouvée':'Un endroit pour vos pensées',q?'Essayez un autre mot.':'Créez une note de cours, une idée ou un brouillon.')+'</div>'}
const fields={tasks:[['title','Tâche','text',true],['subject','Matière','subject'],['date','Échéance','date'],['priority','Priorité','priority']],subjects:[['name','Nom de la matière','text',true],['body','Objectif / description','textarea']],cards:[['subject','Matière','subject'],['question','Question','textarea',true],['answer','Réponse','textarea',true]],notes:[['title','Titre','text',true],['kind','Type','kind'],['body','Votre note','textarea',true]],projects:[['title','Nom du projet','text',true],['kind','Domaine','domain'],['status','Avancement','status'],['date','Échéance','date'],['body','Description / prochaine étape','textarea']],events:[['title','Intitulé','text',true],['subject','Matière','subject'],['date','Date','date',true],['body','À préparer','textarea']]};
const choices={priority:[['normale','Normale'],['haute','Haute']],kind:[['Cours','Cours'],['Idée','Idée'],['Brouillon','Brouillon'],['Personnel','Personnel']],domain:[['Études','Études'],['Animation','Animation'],['Site / application','Site / application'],['Activité','Activité'],['Personnel','Personnel']],status:[['idee','À imaginer'],['cours','En cours'],['fini','Terminé']]};
function editor(type,id){const old=state[type].find(x=>x.id===id)||{},title={tasks:'Une action à accomplir',subjects:'Une matière à explorer',cards:'Une fiche à retenir',notes:'Une idée à conserver',projects:'Un projet à faire grandir',events:'Une date à retenir'}[type];$('#modal').innerHTML='<form id="edit-form"><div class="row"><h2>'+title+'</h2><button type="button" class="btn light mini" data-action="close-modal" aria-label="Fermer">✕</button></div>'+fields[type].map(([key,label,input,required])=>{const val=old[key]||'';let control;if(input==='subject')control='<select name="'+key+'">'+options(val)+'</select>';else if(choices[input])control='<select name="'+key+'">'+choices[input].map(([k,t])=>'<option value="'+k+'" '+(val===k?'selected':'')+'>'+t+'</option>').join('')+'</select>';else if(input==='textarea')control='<textarea name="'+key+'" maxlength="30000" '+(required?'required':'')+'>'+esc(val)+'</textarea>';else control='<input name="'+key+'" type="'+input+'" value="'+esc(val)+'" maxlength="200" '+(required?'required':'')+'>';return '<label>'+label+control+'</label>'}).join('')+'<div class="row wrap"><button class="btn" type="submit">Enregistrer</button>'+(id?'<button type="button" class="btn danger" data-delete="'+type+':'+id+'">Supprimer</button>':'')+'</div></form>';$('#edit-form').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));for(const k in values)values[k]=values[k].trim();if(fields[type].some(([k,,,req])=>req&&!values[k]))return toast('Complétez les champs obligatoires.');if(type==='subjects'&&state.subjects.some(s=>s.id!==id&&s.name.toLocaleLowerCase()===values.name.toLocaleLowerCase()))return toast('Cette matière existe déjà.');const entry={...old,...values,id:id||uid()};if(type==='tasks')entry.done=old.done||false;if(type==='cards'){entry.level=old.level||0;entry.due=old.due||Date.now()}if(id)state[type]=state[type].map(x=>x.id===id?entry:x);else state[type].push(entry);save();$('#modal').close();render()};$('#modal').showModal()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function nextQuestion(){const q=quiz.items[quiz.pos];quiz.answered=false;quiz.correct=false;quiz.choices=shuffle([q.answer,...shuffle([...new Set(state.cards.map(c=>c.answer))].filter(a=>a!==q.answer)).slice(0,3)])}
const actions={
'add-task':()=>editor('tasks'),'add-subject':()=>editor('subjects'),'add-card':()=>editor('cards'),'add-note':()=>editor('notes'),'add-project':()=>editor('projects'),'add-event':()=>editor('events'),'close-modal':()=>$('#modal').close(),
'review-start':()=>{const c=state.cards.find(c=>c.due<=Date.now());if(!c)return toast('Aucune fiche à revoir. Créez une fiche ou attendez sa prochaine échéance.');review={id:c.id,revealed:false};render()},'review-stop':()=>{review=null;render()},reveal:()=>{if(review){review.revealed=true;render()}},'review-again':()=>grade(false),'review-good':()=>grade(true),
'quiz-start':()=>{if(new Set(state.cards.map(c=>c.answer)).size<4)return toast('Ajoutez au moins 4 fiches avec des réponses différentes.');quiz={items:shuffle(state.cards).slice(0,10),pos:0,score:0};nextQuestion();render()},'quiz-next':()=>{if(!quiz?.answered)return;quiz.pos++;if(quiz.pos<quiz.items.length)nextQuestion();render()},
'timer-toggle':()=>{if(timer.running){timer.left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));timer.running=false}else{if(timer.left<=0)timer.left=timer.minutes*60;timer.end=Date.now()+timer.left*1000;timer.running=true}render()},'timer-reset':()=>{timer.running=false;timer.left=timer.minutes*60;render()},
export:()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Dolivin-sauvegarde-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)},
average:()=>{try{const lines=$('#grades').value.trim().split(/\n/).filter(x=>x.trim());if(!lines.length)throw Error('Ajoutez au moins une note.');let total=0,weight=0;for(const line of lines){const m=line.replaceAll(',','.').match(/^\s*(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*;\s*(\d+(?:\.\d+)?)\s*$/);if(!m)throw Error('Format attendu : 14 / 20 ; 2');const [n,max,c]=m.slice(1).map(Number);if(max<=0||c<=0||n>max)throw Error('Vérifiez les notes, maxima et coefficients.');total+=n/max*c;weight+=c}$('#average-result').textContent='Votre moyenne : '+(total/weight*20).toLocaleString('fr-FR',{maximumFractionDigits:2})+' / 20 ('+(total/weight*100).toFixed(1)+' %).'}catch(e){$('#average-result').textContent=e.message}}
};
function grade(good){if(!review?.revealed)return;const c=state.cards.find(c=>c.id===review.id);c.level=good?Math.min(c.level+1,6):0;c.due=Date.now()+(good?[1,1,3,7,14,30,60][c.level]*DAY:60000);save();const n=state.cards.find(x=>x.due<=Date.now());review=n?{id:n.id,revealed:false}:null;render();if(!n)toast('Révisions terminées pour le moment. Bien joué !')}
function tick(){if(timer.running){timer.left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));if(timer.left<=0){timer.running=false;if(timer.mode==='Travail'){state.sessions.push({id:uid(),date:today(),minutes:timer.minutes,subject:timer.subject});save()}toast(timer.mode==='Travail'?'Séance terminée. Prenez une pause.':'Pause terminée. Prêt pour la suite ?');render()}}const el=$('#clock');if(el)el.textContent=String(Math.floor(timer.left/60)).padStart(2,'0')+':'+String(timer.left%60).padStart(2,'0')}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-action]');if(!b)return;if(b.dataset.action&&actions[b.dataset.action])actions[b.dataset.action]();if(b.dataset.edit){const [type,id]=b.dataset.edit.split(':');editor(type,id)}if(b.dataset.delete){const [type,id]=b.dataset.delete.split(':');if(confirm('Supprimer cet élément ?')){state[type]=state[type].filter(x=>x.id!==id);if(type==='subjects')for(const list of ['tasks','cards','events','sessions'])for(const x of state[list])if(x.subject===id)x.subject='';save();$('#modal').close();render()}}if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.duration){if(timer.running&&!confirm('Arrêter la séance en cours ?'))return;timer.running=false;timer.minutes=Number(b.dataset.duration);timer.left=timer.minutes*60;timer.mode=b.dataset.mode;render()}if(b.dataset.answer!==undefined&&quiz&&!quiz.answered){quiz.answered=true;const q=quiz.items[quiz.pos];quiz.correct=quiz.choices[Number(b.dataset.answer)]===q.answer;if(quiz.correct)quiz.score++;else{const c=state.cards.find(c=>c.id===q.id);if(c){c.level=0;c.due=Date.now();save()}}render()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.flash')){e.preventDefault();actions.reveal()}});
document.addEventListener('input',e=>{if(e.target.id==='note-search')$('#note-list').innerHTML=noteList(e.target.value)});
document.addEventListener('change',async e=>{const el=e.target;if(el.dataset.task){const t=state.tasks.find(t=>t.id===el.dataset.task);if(t){t.done=el.checked;save();render()}}if(el.id==='focus-subject')timer.subject=el.value;if(el.id==='import'&&el.files[0]){try{if(el.files[0].size>10000000)throw Error('La sauvegarde dépasse 10 Mo.');const incoming=JSON.parse(await el.files[0].text());validate(incoming);if(confirm('Remplacer votre espace actuel par cette sauvegarde ? Exportez votre espace actuel avant de continuer.')){state=incoming;review=null;quiz=null;timer.running=false;save();render();toast('Sauvegarde importée.')}}catch(error){toast(error.message)}el.value=''}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const s=JSON.parse(e.newValue);validate(s);state=s;review=null;quiz=null;render();toast('Espace actualisé depuis un autre onglet.')}catch{toast('Une modification dans un autre onglet est illisible.')}}});window.addEventListener('hashchange',render);setInterval(tick,1000);render();
</script></body></html>
