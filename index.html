function stats(){const z=C.summary(state,ui.month),p=comparableMonth(),bal=C.totalBalance(state),rate=z.income?z.rate:null;const change=(v,old)=>old?`${v>=old?'+':''}${Math.round((v-old)/old*100)} %`:'—';return `<div class="stats">${stat('Solde total de vos comptes',bal,'wallet',`${icon('shield',10)} Tous comptes · aujourd’hui`,true)}${stat('Revenus du mois',z.income,'down',`<span class="pill">${change(z.income,p.income)}</span> à période comparable`)}${stat('Dépenses du mois',z.expense,'up',`<span class="pill ${z.expense>p.expense&&p.expense?'red':''}">${change(z.expense,p.expense)}</span> hors virements entre comptes`)}${stat('Différence revenus – dépenses',z.net,'target',`<span class="pill ${z.net<0?'red':''}">${rate===null?'—':rate+' %'}</span> ${rate===null?'Ajoutez vos premiers revenus':'part des revenus conservée'}`)}</div>`;}
function cashChart(range=ui.chartRange){
 const months=Array.from({length:range},(_,i)=>C.shiftMonth(ui.month,i-range+1)),ss=months.map(m=>C.summary(state,m)),max=Math.max(1,...ss.flatMap(x=>[x.income,x.expense]))*1.17,w=600,h=218,left=43,right=12,top=14,bottom=32,area=h-top-bottom,step=(w-left-right)/range;
 let svg='';for(let j=0;j<=3;j++){const y=top+area*j/3;svg+=`<line class="gridline" x1="${left}" x2="${w-right}" y1="${y}" y2="${y}"/><text x="${left-10}" y="${y+3}" text-anchor="end">${compact(max*(1-j/3))}</text>`;}
 const pts=[];ss.forEach((z,i)=>{const x=left+step*(i+.5),bar=Math.min(34,step*.35),y=top+area*(1-z.income/max),ey=top+area*(1-z.expense/max);pts.push([x,ey]);svg+=`<rect x="${x-bar/2}" y="${y}" width="${bar}" height="${Math.max(1,top+area-y)}" rx="5" fill="${i===range-1?'#aec696':'#e5ecdD'}"/><text x="${x}" y="${h-7}" text-anchor="middle" style="fill:${i===range-1?'#819c6c':'#acb5a5'}">${new Date(months[i]+'-12').toLocaleDateString('fr-FR',{month:'short'})}</text>`;});
 svg+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ')}" fill="none" stroke="#6b8967" stroke-width="2" stroke-linejoin="round"/>`;
 pts.forEach(([x,y],i)=>{svg+=`<circle cx="${x}" cy="${y}" r="3.4" fill="white" stroke="#6b8967" stroke-width="1.7"/><rect x="${x-step*.4}" y="${top}" width="${step*.8}" height="${area+15}" fill="transparent" tabindex="0" data-tip="${esc(monthLabel(months[i])+ ' · Revenus '+money(ss[i].income)+' · Dépenses '+money(ss[i].expense))}"/>`;});
 return `<div class="chart-shell sensitive-chart"><svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Évolution mensuelle : revenus en barres, dépenses en ligne">${svg}</svg><div class="chart-tip"></div></div>`;
}
function dashboard(){const z=C.summary(state,ui.month),f=C.forecast(state,30),reserved=state.goals.reduce((a,g)=>a+g.saved,0),remaining=C.totalBalance(state)-reserved;const transactions=state.transactions.filter(t=>t.date<=C.iso()).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);const g=state.goals.find(g=>g.saved<g.target)||state.goals[0];
 return stats()+`<div class="dashboard-grid"><section class="card panel"><div class="panel-head"><div><h2>Votre équilibre, mois après mois</h2><p class="subtitle">Les mouvements qui racontent votre budget · ${state.settings.currency}</p></div><div class="segmented"><button data-range="6" class="${ui.chartRange===6?'active':''}">6 mois</button><button data-range="12" class="${ui.chartRange===12?'active':''}">1 an</button></div></div><div class="legend" style="justify-content:flex-end;margin-bottom:12px"><span><i></i>Revenus</span><span><i class="line"></i>Dépenses</span></div>${cashChart()}<div class="chart-note">${icon('sparkles',13)} ${z.net>=0?`Vous avez conservé <strong class="money">${money(z.net)}</strong> sur les revenus de ce mois.`:'Ce mois-ci, vos dépenses dépassent vos revenus enregistrés.'}</div></section>${g?goalFeature(g):`<section class="card goal-feature"><div class="eyebrow">VOTRE PROCHAINE VICTOIRE</div><h2>De la place pour vos envies.</h2><p>Un projet précis donne une bonne raison d’épargner, même petit à petit.</p>${empty('Votre premier projet','Fixez un montant et une échéance.','goal','Créer un projet','target')}</section>`}<section class="card panel transactions-panel"><div class="panel-head"><div><h2>Les derniers mouvements</h2><p class="subtitle">Votre argent, dans les détails.</p></div><button class="btn ghost small" data-view="transactions">Tout voir ${icon('arrow',13)}</button></div>${transactions.length?transactionsTable(transactions,true):empty('Votre histoire commence ici','Ajoutez un revenu, une dépense ou un virement.','transaction','Première opération')}</section><section class="card panel budgets-panel"><div class="panel-head"><div><h2>Les enveloppes du mois</h2><p class="subtitle">Un cap, pas une contrainte.</p></div><button class="tiny-btn" data-view="budgets" aria-label="Voir toutes les enveloppes">${icon('arrow',15)}</button></div>${state.budgets.length?state.budgets.slice(0,4).map(b=>budgetRow(b)).join(''):empty('Un budget à votre mesure','Créez vos premières enveloppes.','budget','Créer une enveloppe','pie')}</section></div><div class="ideas-row"><article class="card insight"><span class="insight-icon">${icon('shield',15)}</span><div><h3>Votre vraie marge</h3><p><span class="money">${money(remaining)}</span> après les <span class="money">${money(reserved)}</span> réservés à vos projets.</p><button data-view="goals">Comprendre mes réserves ${icon('arrow',11)}</button></div></article><article class="card insight"><span class="insight-icon">${icon('calendar',15)}</span><div><h3>${f.firstRisk?'Un point à anticiper':'Une longueur d’avance'}</h3><p>${f.firstRisk?'Un solde estimé sous zéro le '+dateLabel(f.firstRisk,true)+'.':'Votre solde estimé reste positif sur les 30 prochains jours.'}</p><button data-view="forecast">Voir les hypothèses ${icon('arrow',11)}</button></div></article><article class="card insight"><span class="insight-icon">${icon('sparkles',15)}</span><div><h3>Une envie en tête ?</h3><p>Essayez un achat ou une baisse de revenu, sans toucher à vos comptes.</p><button data-view="scenarios">Et si je me le permettais ? ${icon('arrow',11)}</button></div></article></div>`;
}
function goalFeature(g){const pct=Math.min(100,Math.round(g.saved/g.target*100));return `<section class="card goal-feature"><div class="eyebrow">VOTRE PROCHAINE VICTOIRE</div><h2>${esc(g.name)}</h2><p>Chaque somme réservée vous rapproche un peu plus de ce qui compte.</p><div class="goal-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="48" fill="none" stroke="#e4ecd5" stroke-width="7"/><circle cx="60" cy="60" r="48" fill="none" stroke="#9dbd7b" stroke-width="7" stroke-linecap="round" stroke-dasharray="${pct*3.016} 301.6" transform="rotate(-90 60 60)"/></svg><div class="ring-label"><strong>${pct}%</strong><span>du chemin parcouru</span></div></div><div class="goal-sums"><strong class="money">${money(g.saved)}</strong><span class="money">sur ${money(g.target)}</span></div>${btn('Faire un petit pas','fund-goal','plus','',`data-id="${esc(g.id)}"`)}</section>`;}
function transactionsTable(ts,compactMode=false){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>OPÉRATION</th><th class="${compactMode?'optional':''}">DATE</th><th class="category-col">CATÉGORIE</th><th>MONTANT</th></tr></thead><tbody>${ts.map((t,i)=>`<tr><td><div class="transaction-name"><span class="category-icon ${['','blue','sand','rose','purple'][i%5]}">${icon(t.type==='transfer'?'arrows':categoryIcon(t.category),15)}</span><div><strong>${esc(t.description||'Sans libellé')}</strong><small>${esc(accountName(t.accountId))}${t.type==='transfer'?' → '+esc(accountName(t.toAccountId)):''}${t.date>C.iso()?' · Prévu':''}</small></div></div></td><td class="${compactMode?'optional':''}">${dateLabel(t.date,true)}</td><td class="category-col"><span class="tag">${esc(t.type==='transfer'?'Virement':t.category)}</span></td><td><span class="amount money ${t.type}">${t.type==='income'?'+':t.type==='expense'?'−':''}${money(t.amount)}</span>${!compactMode?`<span class="table-actions"><button class="tiny-btn" data-action="transaction" data-id="${esc(t.id)}" aria-label="Modifier ${esc(t.description)}">${icon('edit',13)}</button><button class="tiny-btn" data-action="delete-transaction" data-id="${esc(t.id)}" aria-label="Supprimer ${esc(t.description)}">${icon('trash',13)}</button></span>`:''}</td></tr>`).join('')}</tbody></table></div>`;}
function filteredTransactions(){const q=ui.search.toLocaleLowerCase();return state.transactions.filter(t=>t.date.startsWith(ui.month)&&(ui.type==='all'||t.type===ui.type)&&(ui.account==='all'||t.accountId===ui.account||t.toAccountId===ui.account)&&(ui.category==='all'||t.category===ui.category)&&(!q||(t.description+' '+t.note+' '+t.category+' '+accountName(t.accountId)).toLocaleLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||a.id.localeCompare(b.id));}
function transactionsView(){const ts=filteredTransactions();ui.page=Math.min(ui.page,Math.max(0,Math.ceil(ts.length/15)-1));const page=ts.slice(ui.page*15,(ui.page+1)*15);return `<div class="card panel"><div class="filters"><input type="search" id="tx-search" placeholder="Libellé, note, catégorie…" value="${esc(ui.search)}" aria-label="Filtrer les opérations"><select id="tx-type" aria-label="Type d’opération"><option value="all">Tous les mouvements</option>${[['expense','Dépenses'],['income','Revenus'],['transfer','Virements']].map(([v,l])=>`<option ${ui.type===v?'selected':''} value="${v}">${l}</option>`).join('')}</select><select id="tx-account" aria-label="Compte"><option value="all">Tous les comptes</option>${accountOptions(ui.account)}</select><select id="tx-category" aria-label="Catégorie"><option value="all">Toutes les catégories</option>${categoryOptions(ui.category)}</select>${btn('CSV','export-csv','download','small')}</div>${page.length?transactionsTable(page):empty('Aucune opération ici','Changez vos filtres ou ajoutez votre première opération.','transaction','Ajouter une opération')}<div class="pagination"><span>${ts.length} opération${ts.length>1?'s':''} · ${ui.month===C.iso().slice(0,7)?'Les opérations futures sont marquées « Prévu ».':'Période sélectionnée'}</span><div class="row-actions"><button class="btn small" data-action="page-prev" ${ui.page===0?'disabled':''}>Précédent</button><span>${ui.page+1} / ${Math.max(1,Math.ceil(ts.length/15))}</span><button class="btn small" data-action="page-next" ${(ui.page+1)*15>=ts.length?'disabled':''}>Suivant</button></div></div></div>`;}
function accountsView(){const balances=C.balances(state);return `<div class="account-total"><span>Votre solde consolidé, aujourd’hui</span><strong class="money">${money(C.totalBalance(state))}</strong></div><div class="content-grid">${state.accounts.map((a,i)=>`<article class="card account-card ${i===0?'dark':''}"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="account-symbol">${icon(accountIcon(a.type),21)}</div><button class="tiny-btn" data-action="account" data-id="${esc(a.id)}" aria-label="Modifier ce compte">${icon('edit',15)}</button></div><h2>${esc(a.name)}</h2><div class="balance money">${money(balances[a.id])}</div><footer><span>${{bank:'Compte bancaire',cash:'Argent liquide',mobile:'Portefeuille mobile',savings:'Compte d’épargne'}[a.type]} · ${state.settings.currency}</span><button class="tiny-btn" data-action="reconcile" data-id="${esc(a.id)}" title="Rapprocher le solde">${icon('check',14)}</button></footer></article>`).join('')}<article class="account-card add-card"><button data-action="account">${icon('plus',28)}Un autre compte, une même vue.</button></article></div><div class="helper">${icon('info',14)} Un virement fait circuler votre argent entre deux comptes. Il ne gonfle ni vos revenus ni vos dépenses. Les soldes n’incluent pas les opérations datées dans le futur.</div>`;}
function budgetRow(b,actions=false){const z=C.budgetInfo(state,b,ui.month),pct=z.limit?z.spent/z.limit*100:0;return `<div class="budget-item"><div class="budget-top"><span class="category">${icon(categoryIcon(b.category),13)}${esc(b.category)}</span><small class="money">${money(z.spent)} / ${money(z.limit)}</small>${actions?`<button class="tiny-btn" data-action="budget" data-id="${esc(b.id)}" aria-label="Modifier l’enveloppe">${icon('edit',13)}</button>`:''}</div><div class="bar ${pct>100?'over':''}"><span style="width:${Math.min(100,pct)}%"></span></div><div class="budget-bottom"><span>${Math.round(pct)} % utilisé${z.carry?' · report '+money(z.carry):''}</span><span class="money ${z.remaining<0?'negative':''}">${z.remaining<0?'Dépassement '+money(-z.remaining):'Reste '+money(z.remaining)}</span></div></div>`;}
function budgetsView(){const total=state.budgets.reduce((a,b)=>a+C.budgetInfo(state,b,ui.month).limit,0),spent=state.budgets.reduce((a,b)=>a+C.budgetInfo(state,b,ui.month).spent,0);return `<div class="forecast-stats"><div class="forecast-stat"><p>Montant prévu dans vos enveloppes</p><strong class="money">${money(total)}</strong></div><div class="forecast-stat"><p>Dépensé dans ces catégories</p><strong class="money">${money(spent)}</strong></div><div class="forecast-stat ${spent>total?'risk':''}"><p>Reste dans ces enveloppes</p><strong class="money">${money(total-spent)}</strong></div></div>${state.budgets.length?`<div class="content-grid two">${state.budgets.map(b=>`<section class="card panel">${budgetRow(b,true)}<div class="inline-note">${b.rollover?'Le montant non utilisé des mois précédents est reporté.':'Cette enveloppe repart du montant prévu chaque mois.'}</div></section>`).join('')}</div>`:`<div class="card">${empty('Chaque dépense peut avoir sa place','Commencez par les catégories que vous souhaitez mieux suivre.','budget','Créer ma première enveloppe','pie')}</div>`}<div class="helper">Les enveloppes sont des repères, pas des comptes séparés. Elles suivent uniquement les dépenses enregistrées ; les virements sont exclus. Les réserves de vos projets sont gérées dans « Mes projets ».</div>`;}
function goalsView(){return `${state.goals.length?`<div class="content-grid">${state.goals.map(g=>{const left=Math.max(0,g.target-g.saved),months=Math.max(1,Math.ceil((new Date(g.due)-new Date(C.iso()))/(30.44*86400000))),pct=Math.min(100,Math.round(g.saved/g.target*100));return `<article class="card goal-card"><header><div class="category-icon">${icon(g.icon||'target',17)}</div><button class="tiny-btn" data-action="goal" data-id="${esc(g.id)}" aria-label="Modifier le projet">${icon('edit',15)}</button></header><h2>${esc(g.name)}</h2><p class="subtitle">Votre horizon : ${dateLabel(g.due)}</p><div class="number money">${money(g.saved)}</div><p class="muted" style="font-size:10px">sur <span class="money">${money(g.target)}</span> · ${pct} %</p><div class="bar"><span style="width:${pct}%"></span></div><div class="inline-note">${left?`À titre de repère : <span class="money">${money(Math.ceil(left/months))}</span> par mois d’ici l’échéance.`:'Vous y êtes. Ce projet a atteint son objectif.'}</div><div class="row-actions">${btn('Réserver une somme','fund-goal','plus','small',`data-id="${esc(g.id)}"`)}${btn('Libérer','release-goal','arrows','small',`data-id="${esc(g.id)}"`)}</div></article>`;}).join('')}</div>`:`<div class="card">${empty('Quelle sera votre prochaine victoire ?','Un fonds de secours, un voyage, un équipement… Donnez-lui un nom.','goal','Créer un projet','target')}</div>`}<div class="helper"><strong>Réserver ne déplace pas l’argent.</strong> Les sommes restent dans vos comptes et sont déduites de votre marge disponible et de la projection. Un versement sur un compte d’épargne se saisit séparément comme un virement, pas comme une dépense.</div>`;}
function recurringView(){const from=ui.month+'-01',to=C.monthEnd(ui.month),events=C.occurrences(state,from,to);return `<div class="content-grid two"><section class="card panel"><div class="panel-head"><div><h2>Vos rendez-vous financiers</h2><p class="subtitle">${state.recurring.filter(r=>r.active).length} récurrence(s) active(s)</p></div></div>${state.recurring.length?`<div class="recurring-list">${state.recurring.map(r=>`<div class="recurring-row"><div class="left"><span class="category-icon">${icon(r.type==='income'?'bank':'repeat',16)}</span><div><h3>${esc(r.name)} ${!r.active?'<span class="tag">En pause</span>':''}</h3><small>${{monthly:'Chaque mois, le '+r.day,weekly:'Chaque semaine',yearly:'Chaque année'}[r.frequency]} · ${esc(accountName(r.accountId))}</small></div></div><div class="text-right"><span class="money amount ${r.type}">${r.type==='income'?'+':'−'}${money(r.amount)}</span><button class="tiny-btn" data-action="recurring" data-id="${esc(r.id)}" aria-label="Modifier la récurrence">${icon('edit',14)}</button></div></div>`).join('')}</div>`:empty('Rien à anticiper pour le moment','Ajoutez le loyer, un abonnement ou un revenu régulier.','recurring','Ajouter une récurrence','repeat')}</section><section class="card panel"><div class="panel-head"><div><h2>À enregistrer ce mois-ci</h2><p class="subtitle">Une prévision n’est jamais une opération automatique.</p></div></div>${events.length?events.map(e=>`<div class="recurring-row"><div><h3>${esc(e.name)}</h3><small class="${e.date<C.iso()?'negative':''}">${dateLabel(e.date,true)}${e.date<C.iso()?' · date passée, à vérifier':''}</small></div><div class="row-actions"><span class="amount money">${money(e.amount)}</span>${btn('Enregistrer','record-recurring','check','small',`data-id="${esc(e.id)}" data-date="${e.date}"`)}</div></div>`).join(''):empty('Tout est à jour','Aucune occurrence non enregistrée ce mois-ci.','','','check')}</section></div><div class="helper">Les récurrences alimentent les prévisions. Elles n’affectent vos soldes réels qu’après leur enregistrement. Pour une facture déjà saisie à la main, modifiez-la et associez-la à sa récurrence pour éviter un doublon.</div>`;}
function debtsView(){return `${state.debts.length?`<div class="content-grid">${state.debts.map(d=>`<section class="card goal-card"><header><span class="category-icon">${icon('debt',18)}</span><button class="tiny-btn" data-action="debt" data-id="${esc(d.id)}" aria-label="Modifier la dette">${icon('edit',15)}</button></header><span class="tag">${d.direction==='borrowed'?'Je dois':'On me doit'}</span><h2 style="margin-top:15px">${esc(d.name)}</h2><p class="subtitle">Montant restant</p><div class="debt-number money" style="margin:15px 0">${money(d.remaining)}</div><p class="inline-note">${d.direction==='borrowed'&&d.monthly?`Mensualité prévue : ${money(d.monthly)}, le ${d.dueDay}.`:'Un remboursement enregistré mettra à jour le montant restant.'}</p><div class="row-actions">${btn(d.direction==='borrowed'?'Enregistrer un paiement':'Enregistrer un remboursement','pay-debt','check','small',`data-id="${esc(d.id)}" ${!d.remaining?'disabled':''}`)}</div></section>`).join('')}</div>`:`<div class="card">${empty('Une vue claire de vos engagements','Ajoutez un emprunt ou une somme prêtée à un proche.','debt','Ajouter une dette ou un prêt','debt')}</div>`}<div class="helper">Les remboursements enregistrés créent une opération dans le compte choisi et diminuent la dette. Les mensualités que vous devez sont incluses dans les prévisions ; les sommes que l’on vous doit ne sont pas considérées comme des revenus garantis.</div>`;}
function forecastChart(f,compare=null){const pts=f.points,w=660,h=235,left=47,right=15,top=20,bottom=30,min=Math.min(0,...pts.map(p=>p.balance),...(compare?.points.map(p=>p.balance)||[])),max=Math.max(1,...pts.map(p=>p.balance),...(compare?.points.map(p=>p.balance)||[])),span=Math.max(100,max-min)*1.08,x=i=>left+(w-left-right)*i/(pts.length-1),y=v=>top+(h-top-bottom)*(1-(v-min)/span),path=pp=>pp.map((p,i)=>(i?'L':'M')+x(i)+','+y(p.balance)).join(' ');let svg='';for(let j=0;j<4;j++){const v=min+span*j/3,yy=y(v);svg+=`<line class="gridline" x1="${left}" x2="${w-right}" y1="${yy}" y2="${yy}"/><text x="${left-10}" y="${yy+3}" text-anchor="end">${compact(v)}</text>`;}svg+=`<line x1="${left}" x2="${w-right}" y1="${y(0)}" y2="${y(0)}" stroke="#d9c9b8" stroke-dasharray="4 4"/>`;if(compare)svg+=`<path d="${path(compare.points)}" stroke="#d3ddca" fill="none" stroke-width="2" stroke-dasharray="5 5"/>`;svg+=`<path d="${path(pts)} L${x(pts.length-1)},${h-bottom} L${left},${h-bottom}Z" fill="#ebf2e4" opacity=".7"/><path d="${path(pts)}" stroke="${f.firstRisk?'#be9580':'#86a66b'}" fill="none" stroke-width="2.5"/>`;[0,Math.floor(pts.length/2),pts.length-1].forEach(i=>svg+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${dateLabel(pts[i].date,true)}</text>`);pts.forEach((p,i)=>svg+=`<circle r="7" cx="${x(i)}" cy="${y(p.balance)}" fill="transparent" tabindex="0" data-tip="${esc(dateLabel(p.date,true)+' · '+money(p.balance))}"/>`);return `<div class="chart-shell sensitive-chart"><svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Solde de trésorerie estimé dans le temps">${svg}</svg><div class="chart-tip"></div></div>`;}
function forecastStats(f){return `<div class="forecast-stats"><div class="forecast-stat"><p>Disponible après réserves, aujourd’hui</p><strong class="money">${money(f.start)}</strong></div><div class="forecast-stat ${f.end<0?'risk':''}"><p>Solde estimé à l’horizon choisi</p><strong class="money">${money(f.end)}</strong></div><div class="forecast-stat ${f.firstRisk?'risk':''}"><p>Point le plus bas estimé</p><strong class="money">${money(f.minimum)}</strong></div></div>`;}
function calendar(f){const m=C.iso().slice(0,7),start=m+'-01',end=C.monthEnd(m),offset=(new Date(start+'T12:00Z').getUTCDay()+6)%7,events=C.occurrences(state,start,end);let cells='';for(let i=0;i<offset;i++)cells+='<div class="cal-day off"></div>';for(let d=1;d<=Number(end.slice(8));d++){const date=m+'-'+String(d).padStart(2,'0');cells+=`<div class="cal-day ${date===C.iso()?'today':''}"><span class="number">${d}</span>${events.filter(e=>e.date===date).map(e=>`<div class="cal-event ${e.type}" title="${esc(e.name+' · '+money(e.amount))}">${esc(e.name)}</div>`).join('')}</div>`;}return `<h3 style="margin:0 0 15px;color:#8d9f7b">${monthLabel(m)} · échéances récurrentes non enregistrées</h3><div class="month-calendar">${['LUN','MAR','MER','JEU','VEN','SAM','DIM'].map(d=>`<div class="day-label">${d}</div>`).join('')}${cells}</div>`;}
function forecastView(){const f=C.forecast(state,ui.days);return `<div class="card panel"><div class="panel-head"><div><h2>Voir venir, pour mieux respirer</h2><p class="subtitle">Une estimation issue de vos données, pas une promesse.</p></div><select id="forecast-days" class="month-picker" aria-label="Horizon de projection">${[30,60,90].map(d=>`<option value="${d}" ${ui.days===d?'selected':''}>${d} jours</option>`).join('')}</select></div>${forecastStats(f)}<div class="view-tabs"><button data-forecast-tab="curve" class="${ui.forecastTab==='curve'?'active':''}">La courbe à venir</button><button data-forecast-tab="calendar" class="${ui.forecastTab==='calendar'?'active':''}">Le calendrier du mois</button></div>${ui.forecastTab==='calendar'?calendar(f):forecastChart(f)}<div class="helper"><strong>Comment est-ce calculé ?</strong> Solde réel moins les <span class="money">${money(f.reserved)}</span> réservés aux projets, puis opérations futures, récurrences et mensualités. Les dépenses variables sont estimées à <span class="money">${money(f.daily)}</span> par jour, à partir des 30 derniers jours hors charges reconnues. ${f.firstRisk?'Un solde négatif apparaît le '+dateLabel(f.firstRisk)+'.':'Aucun solde négatif estimé sur cette période.'} Les dépenses et mensualités du mois dont l’échéance est passée et non enregistrée sont imputées aujourd’hui ; les revenus échus non reçus ne sont pas anticipés. Les revenus à venir restent incertains.</div></div><section class="card panel" style="margin-top:22px"><div class="panel-head"><h2>Les prochains rendez-vous</h2></div>${f.events.length?f.events.slice(0,12).map(e=>`<div class="recurring-row"><div><h3>${esc(e.name||e.description)}</h3><small>${dateLabel(e.date)}${e.overdueDate?' · échéance du '+dateLabel(e.overdueDate,true):''} · ${{recurring:'Récurrence',scheduled:'Opération prévue',debt:'Mensualité'}[e.source]}</small></div><strong class="amount money ${e.type}">${e.type==='income'?'+':'−'}${money(e.amount)}</strong></div>`).join(''):empty('Pas d’échéance connue','Ajoutez vos revenus et charges récurrents pour enrichir cette vue.','recurring','Ajouter une récurrence','calendar')}</section>`;}
function scenarioOutput(){const baseline=C.forecast(state,30),f=C.forecast(state,30,C.iso(),{purchase:ui.purchase,incomeDrop:ui.incomeDrop,cut:ui.cut});return `<div class="verdict ${f.firstRisk?'risk':''}"><div class="eyebrow">VOTRE SIMULATION · 30 JOURS</div><h2>${f.firstRisk?'Cette décision demande un ajustement.':'Votre marge estimée reste positive.'}</h2><p>${f.firstRisk?'Avec ces hypothèses, votre solde passe sous zéro le '+dateLabel(f.firstRisk)+'.':'Avec ces hypothèses, vos comptes restent au-dessus de zéro après les réserves des projets.'} Cette simulation ne modifie aucune donnée réelle.</p></div>${forecastStats(f)}${forecastChart(f,baseline)}<div class="inline-note">Courbe en pointillés : situation actuelle. Courbe pleine : votre scénario. Les données manquantes ou les dépenses imprévues peuvent changer le résultat.</div>`;}
function scenariosView(){return `<div class="scenario-layout"><section class="card panel"><div class="panel-head"><div><h2>Et si je me le permettais ?</h2><p class="subtitle">Un petit laboratoire pour vos décisions.</p></div></div><div class="field"><label for="scenario-purchase">Un achat que j’envisage (${state.settings.currency})</label><input id="scenario-purchase" inputmode="decimal" value="${raw(ui.purchase)}"><small>Le montant est retiré aujourd’hui dans la simulation uniquement.</small></div><div class="slider-row"><label for="scenario-income">Mes revenus à venir baissent de <strong id="income-label">${ui.incomeDrop} %</strong></label><input type="range" id="scenario-income" min="0" max="100" value="${ui.incomeDrop}"></div><div class="slider-row"><label for="scenario-cut">Je réduis mes dépenses variables de <strong id="cut-label">${ui.cut} %</strong></label><input type="range" id="scenario-cut" min="0" max="70" value="${ui.cut}"></div><div class="helper">Les revenus déjà encaissés ne changent pas. La réduction de dépenses concerne seulement le rythme variable estimé, pas vos factures fixes.</div>${btn('Tout remettre à zéro','reset-scenario','refresh','small','style="margin-top:20px"')}</section><section class="card panel" id="scenario-output">${scenarioOutput()}</section></div>`;}
function reportsView(){const spend=C.categorySpend(state,ui.month),entries=Object.entries(spend).sort((a,b)=>b[1]-a[1]),sum=entries.reduce((a,b)=>a+b[1],0),z=C.summary(state,ui.month),topEntries=entries.length>7?[...entries.slice(0,6),['Autres catégories',entries.slice(6).reduce((a,b)=>a+b[1],0)]]:entries;let acc=0;const circles=topEntries.map(([c,v],i)=>{const len=sum?v/sum*301.6:0,el=`<circle cx="60" cy="60" r="48" fill="none" stroke="${C.COLORS[i]}" stroke-width="16" stroke-dasharray="${len} ${301.6-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"/>`;acc+=len;return el;}).join('');return stats()+`<div class="report-split"><section class="card panel"><div class="panel-head"><div><h2>Les six derniers mois</h2><p class="subtitle">Revenus en barres, dépenses en ligne.</p></div></div>${cashChart(6)}</section><section class="card panel"><h2>Ce qui compose vos dépenses</h2>${entries.length?`<div class="donut-wrap sensitive-chart"><svg width="140" height="140" viewBox="0 0 120 120" role="img" aria-label="Répartition des dépenses par catégorie"><circle cx="60" cy="60" r="48" fill="none" stroke="#edf1e7" stroke-width="16"/>${circles}<text x="60" y="58" text-anchor="middle" fill="#748c5e" style="font:600 13px sans-serif">${entries.length}</text><text x="60" y="72" text-anchor="middle" fill="#a1af92" style="font:7px sans-serif">catégories</text></svg><div class="donut-legend">${topEntries.map(([c,v],i)=>`<div><span><i style="background:${C.COLORS[i]}"></i>${esc(c)}</span><strong>${Math.round(v/sum*100)} %</strong></div>`).join('')}</div></div>`:empty('Pas encore de répartition','Vos dépenses feront apparaître ce graphique.','','','pie')}</section></div><section class="card panel" style="margin-top:22px"><div class="panel-head"><h2>Votre bilan du mois · ${monthLabel(ui.month)}</h2>${btn('Exporter les opérations','export-csv','download','small')}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>CATÉGORIE</th><th>DÉPENSÉ</th><th>PART DU TOTAL</th><th>REPÈRE BUDGÉTAIRE</th></tr></thead><tbody>${entries.map(([c,v])=>{const b=state.budgets.find(b=>b.category===c);return `<tr><td>${esc(c)}</td><td class="money">${money(v)}</td><td>${Math.round(v/sum*100)} %</td><td>${b?Math.round(v/C.budgetInfo(state,b,ui.month).limit*100)+' % de l’enveloppe':'Aucune enveloppe'}</td></tr>`;}).join('')||'<tr><td colspan="4">Aucune dépense sur ce mois.</td></tr>'}</tbody></table></div><div class="helper">Différence du mois : <strong class="money">${money(z.net)}</strong>. Ce chiffre ne mesure pas les virements vers l’épargne et ne comprend pas les opérations datées après aujourd’hui.</div></section>`;}
function settingsView(){return `<div class="settings-grid"><section class="card panel"><div class="panel-head"><h2>Votre espace</h2></div><form id="settings-form"><div class="form-grid"><div class="field"><label for="setting-name">Votre prénom ou votre nom</label><input id="setting-name" name="name" maxlength="80" required value="${esc(state.settings.name)}"></div><div class="field"><label for="setting-currency">Devise du budget</label><select id="setting-currency" name="currency" ${state.transactions.length?'disabled':''}>${[['CDF','Franc congolais · CDF'],['USD','Dollar américain · USD'],['EUR','Euro · EUR']].map(([v,l])=>`<option value="${v}" ${v===state.settings.currency?'selected':''}>${l}</option>`).join('')}</select><small>${state.transactions.length?'La devise est verrouillée après les premières opérations pour éviter une conversion trompeuse.':'Les montants ne sont pas convertis automatiquement.'}</small></div><div class="field full"><label for="setting-category">Ajouter une catégorie personnelle</label><input id="setting-category" name="category" placeholder="Par exemple : Projets créatifs" maxlength="70"><small>${state.settings.categories.length?'Vos catégories : '+esc(state.settings.categories.join(', ')):'Les catégories habituelles sont déjà disponibles.'}</small></div></div><button class="btn primary" style="margin-top:20px" type="submit">${icon('check',15)}Enregistrer mes préférences</button></form><div class="hr"></div><div class="setting-row"><div><h3>Montants discrets à l’écran</h3><p>Masque les chiffres lors d’une présentation. Ce réglage n’est pas un verrou de sécurité.</p></div><button class="toggle ${ui.private?'active':''}" data-action="privacy" aria-label="Masquer les montants" aria-pressed="${ui.private}"></button></div><div class="setting-row"><div><h3>${demo?'Démonstration':'Votre budget réel'}</h3><p>${demo?'Des données fictives pour essayer toutes les fonctions.':'Sauvegarde dans ce navigateur, sur cet appareil. Exportez une copie pour la conserver ailleurs.'}</p></div>${btn(demo?'Mon budget':'Essayer la démo',demo?'real':'demo','arrows','small')}</div></section><section class="card panel"><div class="panel-head"><h2>Vos données vous appartiennent</h2></div><div class="setting-row"><div><h3>Une copie complète</h3><p>Comptes, opérations, projets, dettes et réglages dans un fichier JSON.</p></div>${btn('Exporter','export-json','download','small')}</div><div class="setting-row"><div><h3>Restaurer une sauvegarde</h3><p>Une confirmation sera demandée avant de remplacer le budget affiché.</p></div>${btn('Restaurer','import-json','upload','small')}</div><div class="setting-row"><div><h3>Importer un relevé CSV</h3><p>Choisissez les colonnes et vérifiez l’aperçu avant d’ajouter des opérations.</p></div>${btn('Importer','import','upload','small')}</div><div class="setting-row"><div><h3>Commencer sur une page blanche</h3><p>Vous pourrez exporter une copie avant toute réinitialisation.</p></div>${btn('Réinitialiser','reset','refresh','small danger')}</div><div class="helper">Aucune connexion bancaire, aucun transfert d’argent automatique. Luma organise vos saisies et vos imports. Les prévisions reposent sur ce que vous avez renseigné.</div></section></div>`;}
function toast(message,undo=null){clearTimeout(toastTimer);$('#toast-root').innerHTML=`<div class="toast"><span>${esc(message)}</span>${undo?'<button data-action="undo">Annuler</button>':''}</div>`;lastUndo=undo;toastTimer=setTimeout(()=>{$('#toast-root').innerHTML='';lastUndo=null;},8500);}
function mutate(fn,message='Modification enregistrée.'){const before=C.clone(state);try{fn(state);C.validateState(state);}catch(e){state=before;throw e;}if(!demo){realCache=C.clone(state);queueSave();}render();toast(demo?message+' · Démo':message,()=>{state=before;if(!demo){realCache=C.clone(state);queueSave();}render();toast('Modification annulée.');});}
function queueSave(){queued=C.clone(state);if(saving||conflict)return;flushSave();}
async function flushSave(){if(!queued||demo||conflict)return;saving=true;saveStatus='saving';render();while(queued&&!demo){const snapshot=queued;queued=null;try{const r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:snapshot,revision})});const body=await r.json();if(!r.ok){if(r.status===409)conflict=true;throw Error(body.error||'La sauvegarde n’a pas abouti.');}revision=body.revision;saveStatus='saved';saveError='';}catch(e){queued=queued||C.clone(state);saveStatus='error';saveError=e.message||'Connexion indisponible. Exportez une copie avant de fermer cette page.';break;}}saving=false;render();}
async function load(){try{const r=await fetch('/api/state',{signal:AbortSignal.timeout(10000)});const b=await r.json();if(!r.ok)throw Error(b.error||'Connexion indisponible.');revision=b.revision;if(b.state){C.validateState(b.state);state=b.state;realCache=C.clone(state);demo=false;saveStatus='saved';}else saveStatus='demo';}catch(e){saveError=e.message;saveStatus='error';toast('La démonstration reste disponible. '+e.message);}render();}
function closeModal(){const root=$('#modal-root');root.innerHTML='';currentSubmit=null;if(currentConfirm){currentConfirm(false);currentConfirm=null;}}
function openModal(title,body,submit,onSubmit,options={}){$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${options.wide?'wide-modal':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-head"><div><h2 id="dialog-title">${esc(title)}</h2>${options.sub?'<p>'+esc(options.sub)+'</p>':''}</div><button class="icon-btn" data-action="close-modal" aria-label="Fermer">${icon('close',17)}</button></div><form id="modal-form"><div class="form-error" id="modal-error" role="alert"></div>${body}<div class="modal-footer"><button class="btn" type="button" data-action="close-modal">Annuler</button><button type="submit" class="btn primary">${esc(submit)}</button></div></form></section></div>`;currentSubmit=onSubmit;setTimeout(()=>$('#modal-root input, #modal-root select, #modal-root button[type=submit]')?.focus(),30);}
function confirmAction(title,text,button='Confirmer'){return new Promise(resolve=>{openModal(title,`<p style="font-size:12px;line-height:1.9;color:#8a9e79">${esc(text)}</p>`,button,()=>{currentConfirm=null;resolve(true);return true;});currentConfirm=resolve;});}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;}
function selectField(label,name,options){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options}</select></div>`;}
function transactionModal(id=null,preset={}){const old=state.transactions.find(t=>t.id===id),t=old||{id:C.uid(),date:C.iso(),type:'expense',amount:0,accountId:state.accounts[0].id,category:'Alimentation',description:'',note:'',...preset};
 openModal(old?'Modifier l’opération':'Un nouveau mouvement',`<div class="form-grid">${selectField('Type de mouvement','type',[['expense','Une dépense'],['income','Un revenu'],['transfer','Un virement entre comptes']].map(([v,l])=>`<option value="${v}" ${v===t.type?'selected':''}>${l}</option>`).join(''))}${field('Montant ('+state.settings.currency+')','amount',t.amount?raw(t.amount):'','text','inputmode="decimal" required')}${field('Date','date',t.date,'date','required')}${selectField('Compte','accountId',accountOptions(t.accountId))}<div id="transfer-field" class="field" ${t.type!=='transfer'?'hidden':''}><label for="f-toAccountId">Compte de destination</label><select name="toAccountId" id="f-toAccountId">${accountOptions(t.toAccountId||state.accounts.find(a=>a.id!==t.accountId)?.id)}</select></div><div id="category-field" class="field" ${t.type==='transfer'?'hidden':''}><label for="f-category">Catégorie</label><select name="category" id="f-category">${categoryOptions(t.category)}</select></div><div class="field full"><label for="f-description">Libellé</label><input id="f-description" name="description" value="${esc(t.description)}" maxlength="160" placeholder="Par exemple : Courses du marché" required></div><div class="field full"><label for="f-note">Une note, si vous voulez</label><textarea name="note" id="f-note" maxlength="800">${esc(t.note)}</textarea></div>${selectField('Associer à une récurrence (facultatif)','recurringId','<option value="">Aucune récurrence</option>'+state.recurring.map(r=>`<option value="${esc(r.id)}" ${t.recurringId===r.id?'selected':''}>${esc(r.name)}</option>`).join(''))}${field('Date de l’échéance associée','occurrence',t.occurrence||t.date,'date')}</div>`,old?'Enregistrer':'Ajouter l’opération',fd=>{const data=Object.fromEntries(fd);const amount=C.parseMoney(data.amount);if(amount<=0)throw Error('Le montant doit être supérieur à zéro.');const item={...t,...data,amount,category:data.type==='transfer'?'Virement':data.category};if(data.type!=='transfer')delete item.toAccountId;if(!item.recurringId){delete item.recurringId;delete item.occurrence;}if(!state.accounts.some(a=>a.id===item.accountId))throw Error('Choisissez un compte.');if(item.type==='transfer'&&item.accountId===item.toAccountId)throw Error('Choisissez deux comptes différents.');if(item.recurringId&&state.transactions.some(x=>x.id!==item.id&&x.recurringId===item.recurringId&&x.occurrence===item.occurrence))throw Error('Cette échéance est déjà enregistrée.');const linkedDebt=old?.debtId?state.debts.find(d=>d.id===old.debtId):null;if(linkedDebt&&(item.type!==(linkedDebt.direction==='borrowed'?'expense':'income')||item.amount>linkedDebt.remaining+old.amount||item.date>C.iso()))throw Error('Pour ce remboursement, conservez le sens du mouvement, une date passée ou actuelle et un montant dans la dette restante.');mutate(s=>{if(linkedDebt)s.debts.find(d=>d.id===linkedDebt.id).remaining+=old.amount-item.amount;if(old)s.transactions[s.transactions.findIndex(x=>x.id===id)]=item;else s.transactions.push(item);},'Opération enregistrée dans votre budget.');return true;},{sub:'Les virements ne sont jamais comptés comme des dépenses.'});
 $('#f-type').addEventListener('change',e=>{const transfer=e.target.value==='transfer';$('#transfer-field').hidden=!transfer;$('#category-field').hidden=transfer;if(e.target.value==='income')$('#f-category').value='Revenus';});}
function accountModal(id){const a=state.accounts.find(a=>a.id===id)||{id:C.uid(),name:'',type:'bank',opening:0};openModal(id?'Votre compte':'Un compte de plus',`<div class="form-grid">${field('Nom du compte','name',a.name,'text','required maxlength="80"')}${selectField('Type','type',[['bank','Compte bancaire'],['mobile','Mobile Money'],['cash','Espèces'],['savings','Épargne']].map(([v,l])=>`<option value="${v}" ${v===a.type?'selected':''}>${l}</option>`).join(''))}${field('Solde de départ ('+state.settings.currency+')','opening',raw(a.opening),'text','inputmode="decimal" required')}<div class="field full"><small>Le solde de départ est le solde avant la première opération que vous enregistrez. Un montant négatif est possible. Tous les comptes utilisent la devise du budget.</small></div></div>${id?`<div class="hr"></div>${btn('Supprimer ce compte','delete-account','trash','small danger',`data-id="${esc(id)}"`)}`:''}`,'Enregistrer',fd=>{const x={...a,...Object.fromEntries(fd)};x.opening=C.parseMoney(x.opening);mutate(s=>{const i=s.accounts.findIndex(x=>x.id===id);if(i>=0)s.accounts[i]=x;else s.accounts.push(x);},'Compte enregistré.');return true;});}
function reconcileModal(id){const a=state.accounts.find(a=>a.id===id),current=C.balances(state)[id];openModal('Rapprocher le solde',`<p class="inline-note" style="margin:0 0 18px">${esc(a.name)} · solde calculé : <span class="money">${money(current)}</span>. Cette correction ajuste le solde de départ ; elle ne crée ni revenu ni dépense.</p><div class="form-grid">${field('Solde constaté aujourd’hui ('+state.settings.currency+')','balance',raw(current),'text','inputmode="decimal" required')}</div>`,'Corriger le solde',fd=>{const amount=C.parseMoney(fd.get('balance'));mutate(s=>{s.accounts.find(x=>x.id===id).opening+=amount-current;},'Solde rapproché.');return true;});}
function budgetModal(id){const b=state.budgets.find(x=>x.id===id)||{id:C.uid(),category:'Alimentation',limit:0,rollover:false};openModal(id?'Ajuster une enveloppe':'Une enveloppe pour le mois',`<div class="form-grid">${selectField('Catégorie','category',categoryOptions(b.category))}${field('Montant mensuel ('+state.settings.currency+')','limit',b.limit?raw(b.limit):'','text','inputmode="decimal" required')}<div class="field full check"><input type="checkbox" name="rollover" id="f-rollover" ${b.rollover?'checked':''}><label for="f-rollover">Reporter les montants non utilisés d’un mois à l’autre</label></div></div><div class="inline-note">Le montant est votre référence mensuelle pour cette catégorie, à partir de ${monthLabel(state.settings.startMonth)}. Modifier une enveloppe actualise aussi ses repères historiques.</div>${id?btn('Supprimer cette enveloppe','delete-budget','trash','small danger',`data-id="${esc(id)}" style="margin-top:20px"`):''}`,'Enregistrer',fd=>{const item={id:b.id,category:fd.get('category'),limit:C.parseMoney(fd.get('limit')),rollover:fd.get('rollover')==='on'};if(item.limit<=0)throw Error('Choisissez un montant supérieur à zéro.');if(state.budgets.some(x=>x.id!==b.id&&x.category===item.category))throw Error('Cette catégorie possède déjà une enveloppe.');mutate(s=>{const i=s.budgets.findIndex(x=>x.id===id);if(i>=0)s.budgets[i]=item;else s.budgets.push(item);},'Enveloppe enregistrée.');return true;});}
function goalModal(id){const g=state.goals.find(g=>g.id===id)||{id:C.uid(),name:'',target:0,saved:0,due:C.addDays(C.iso(),180),icon:'target'};openModal(id?'Votre projet':'Une envie devient un projet',`<div class="form-grid"><div class="field full"><label for="f-name">Le nom de votre projet</label><input name="name" id="f-name" value="${esc(g.name)}" required maxlength="100" placeholder="Par exemple : Mon fonds de tranquillité"></div>${field('Montant à atteindre ('+state.settings.currency+')','target',g.target?raw(g.target):'','text','inputmode="decimal" required')}${field('Déjà réservé dans vos comptes','saved',raw(g.saved),'text','inputmode="decimal" required')}${field('Échéance souhaitée','due',g.due,'date','required')}${selectField('Symbole','icon',['target','shield','heart','sparkles','home','book'].map(x=>`<option value="${x}" ${x===g.icon?'selected':''}>${{target:'Objectif',shield:'Sécurité',heart:'Ce qui compte',sparkles:'Projet',home:'Maison',book:'Apprentissage'}[x]}</option>`).join(''))}</div><div class="helper">Les sommes réservées restent dans vos comptes. Elles sont simplement protégées dans votre marge et vos projections.</div>${id?btn('Supprimer le projet','delete-goal','trash','small danger',`data-id="${esc(id)}" style="margin-top:18px"`):''}`,'Enregistrer le projet',fd=>{const item={...g,...Object.fromEntries(fd),target:C.parseMoney(fd.get('target')),saved:C.parseMoney(fd.get('saved'))};if(item.target<=0||item.saved<0)throw Error('Vérifiez les montants du projet.');mutate(s=>{const i=s.goals.findIndex(x=>x.id===id);if(i>=0)s.goals[i]=item;else s.goals.push(item);},'Projet enregistré.');return true;});}
function fundGoal(id,release=false){const g=state.goals.find(g=>g.id===id);openModal(release?'Libérer une réserve':'Un petit pas pour '+g.name,`<p class="inline-note" style="margin:0 0 18px">Réservé actuellement : <span class="money">${money(g.saved)}</span>. Aucun mouvement bancaire ne sera créé.</p><div class="form-grid">${field('Montant à '+(release?'libérer':'réserver')+' ('+state.settings.currency+')','amount','','text','inputmode="decimal" required')}</div>`,release?'Libérer cette somme':'Réserver cette somme',fd=>{const amount=C.parseMoney(fd.get('amount'));if(amount<=0)throw Error('Choisissez un montant supérieur à zéro.');if(release&&amount>g.saved)throw Error('Le montant dépasse la réserve du projet.');if(!release&&amount>C.totalBalance(state)-state.goals.reduce((a,g)=>a+g.saved,0))throw Error('Cette somme dépasse l’argent non réservé dans vos comptes.');mutate(s=>{s.goals.find(x=>x.id===id).saved+=(release?-1:1)*amount;},release?'Somme rendue disponible.':'Votre projet avance.');return true;});}
function recurringModal(id){const r=state.recurring.find(r=>r.id===id)||{id:C.uid(),name:'',type:'expense',amount:0,accountId:state.accounts[0].id,category:'Abonnements',frequency:'monthly',day:1,starts:C.iso(),active:true};openModal(id?'Ajuster une récurrence':'Un rendez-vous à ne pas oublier',`<div class="form-grid">${field('Nom','name',r.name,'text','required maxlength="120"')}${selectField('Type','type',`<option value="expense" ${r.type==='expense'?'selected':''}>Une dépense</option><option value="income" ${r.type==='income'?'selected':''}>Un revenu</option>`)}${field('Montant ('+state.settings.currency+')','amount',r.amount?raw(r.amount):'','text','inputmode="decimal" required')}${selectField('Compte','accountId',accountOptions(r.accountId))}${selectField('Catégorie','category',categoryOptions(r.category))}${selectField('Rythme','frequency',[['monthly','Chaque mois'],['weekly','Chaque semaine'],['yearly','Chaque année']].map(([v,l])=>`<option value="${v}" ${v===r.frequency?'selected':''}>${l}</option>`).join(''))}${field('Jour du mois (rythme mensuel)','day',r.day,'number','min="1" max="31" required')}${field('Première date de référence','starts',r.starts,'date','required')}<div class="field full check"><input type="checkbox" name="active" id="f-active" ${r.active?'checked':''}><label for="f-active">Récurrence active</label></div></div><p class="inline-note">Le rythme hebdomadaire et annuel part de la date de référence. Un jour mensuel 29–31 est ramené au dernier jour d’un mois plus court.</p>${id?btn('Supprimer la récurrence','delete-recurring','trash','small danger',`data-id="${esc(id)}" style="margin-top:18px"`):''}`,'Enregistrer',fd=>{const item={...r,...Object.fromEntries(fd),amount:C.parseMoney(fd.get('amount')),day:Number(fd.get('day')),active:fd.get('active')==='on'};if(item.amount<=0)throw Error('Vérifiez le montant.');mutate(s=>{const i=s.recurring.findIndex(x=>x.id===id);if(i>=0)s.recurring[i]=item;else s.recurring.push(item);},'Récurrence enregistrée.');return true;});}
function debtModal(id){const d=state.debts.find(d=>d.id===id)||{id:C.uid(),name:'',direction:'borrowed',remaining:0,monthly:0,dueDay:1};openModal(id?'Votre engagement':'Une dette ou une somme prêtée',`<div class="form-grid">${field('Nom ou libellé','name',d.name,'text','required maxlength="120"')}${selectField('Sens','direction',`<option value="borrowed" ${d.direction==='borrowed'?'selected':''}>Je dois cette somme</option><option value="lent" ${d.direction==='lent'?'selected':''}>On me doit cette somme</option>`)}${field('Reste à rembourser ('+state.settings.currency+')','remaining',raw(d.remaining),'text','inputmode="decimal" required')}${field('Mensualité prévue (0 si aucune)','monthly',raw(d.monthly),'text','inputmode="decimal" required')}${field('Jour mensuel de l’échéance','dueDay',d.dueDay,'number','min="1" max="31" required')}</div><p class="inline-note">Cette fiche suit un montant restant. Elle ne crée pas rétroactivement l’emprunt ou le prêt dans vos comptes.</p>${id?btn('Supprimer la fiche','delete-debt','trash','small danger',`data-id="${esc(id)}" style="margin-top:18px"`):''}`,'Enregistrer',fd=>{const item={...d,...Object.fromEntries(fd),remaining:C.parseMoney(fd.get('remaining')),monthly:C.parseMoney(fd.get('monthly')),dueDay:Number(fd.get('dueDay'))};if(item.remaining<0||item.monthly<0)throw Error('Les montants doivent être positifs ou nuls.');mutate(s=>{const i=s.debts.findIndex(x=>x.id===id);if(i>=0)s.debts[i]=item;else s.debts.push(item);},'Engagement enregistré.');return true;});}
function payDebt(id){const d=state.debts.find(d=>d.id===id);openModal('Enregistrer un remboursement',`<p class="inline-note" style="margin:0 0 18px">${esc(d.name)} · reste <span class="money">${money(d.remaining)}</span>.</p><div class="form-grid">${field('Montant ('+state.settings.currency+')','amount',raw(Math.min(d.monthly||d.remaining,d.remaining)),'text','inputmode="decimal" required')}${selectField('Compte concerné','accountId',accountOptions(state.accounts[0].id))}${field('Date','date',C.iso(),'date','required')}</div>`,'Enregistrer le paiement',fd=>{const amount=C.parseMoney(fd.get('amount'));if(fd.get('date')>C.iso())throw Error('Enregistrez un remboursement seulement une fois réalisé. La mensualité prévue apparaît déjà dans les prévisions.');if(amount<=0||amount>d.remaining)throw Error('Le paiement doit être positif et ne pas dépasser le montant restant.');mutate(s=>{s.debts.find(x=>x.id===id).remaining-=amount;s.transactions.push({id:C.uid(),date:fd.get('date'),type:d.direction==='borrowed'?'expense':'income',amount,accountId:fd.get('accountId'),category:d.direction==='borrowed'?'Dettes':'Remboursements',description:'Remboursement · '+d.name,note:'',debtId:id});},'Remboursement enregistré.');return true;});}
function realBudget(){if(realCache){state=C.clone(realCache);demo=false;saveStatus=saveError?'error':'saved';render();return;}openModal('Bienvenue chez vous, '+state.settings.name.split(' ')[0],`<p class="inline-note" style="margin:0 0 20px">Nous partons d’un budget vide. Les données de démonstration ne seront pas copiées.</p><div class="form-grid">${field('Votre nom','name',state.settings.name,'text','required maxlength="80"')}${selectField('Votre devise','currency',[['CDF','Franc congolais (CDF)'],['USD','Dollar américain (USD)'],['EUR','Euro (EUR)']].map(([v,l])=>`<option value="${v}" ${v==='CDF'?'selected':''}>${l}</option>`).join(''))}${field('Nom de votre premier compte','account','Compte principal','text','required maxlength="80"')}${field('Solde de départ','opening','0','text','inputmode="decimal" required')}</div><div class="helper">Vous pourrez ensuite ajouter vos autres comptes, vos revenus et vos dépenses. Si vous importez un historique, utilisez comme solde de départ le montant avant la première opération importée.</div>`,'Créer mon budget personnel',fd=>{const s=C.emptyState();s.settings.name=fd.get('name');s.settings.currency=fd.get('currency');s.accounts[0].name=fd.get('account');s.accounts[0].opening=C.parseMoney(fd.get('opening'));C.validateState(s);state=s;realCache=C.clone(s);demo=false;queueSave();render();toast('Votre espace personnel est prêt.');return true;});}
function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function exportJSON(){download('Luma-'+(demo?'demo-':'')+C.iso()+'.json',JSON.stringify({app:'Luma',version:1,exportedAt:new Date().toISOString(),demo,state},null,2));toast('Votre copie complète a été téléchargée.');}
function pickFile(accept,callback){const input=document.createElement('input');input.type='file';input.accept=accept;input.onchange=async()=>{try{if(input.files[0])await callback(input.files[0]);}catch(e){toast(e.message);}};input.click();}
async function importJSON(){pickFile('.json,application/json',async file=>{if(file.size>1500000)throw Error('La sauvegarde est trop volumineuse.');const data=JSON.parse(await file.text()),s=data.state||data;C.validateState(s);if(await confirmAction('Restaurer cette sauvegarde ?',`${s.transactions.length} opérations, ${s.accounts.length} comptes et ${s.goals.length} projets remplaceront le budget ${demo?'de démonstration':'personnel'} affiché. Exportez d’abord une copie si vous voulez conserver la version actuelle.`,'Restaurer le budget')){mutate(()=>{state=C.clone(s);},'Sauvegarde restaurée.');}});}
function csvDate(v){v=v.trim();if(/^\d{2}\/\d{2}\/\d{4}$/.test(v)){const [d,m,y]=v.split('/');v=y+'-'+m+'-'+d;}if(!C.validDate(v))throw Error('Date invalide : '+v);return v;}
function importCSV(){pickFile('.csv,.tsv,text/csv',async file=>{if(file.size>1500000)throw Error('Le fichier est trop volumineux.');const rows=C.parseCSV(await file.text()),headers=rows[0],data=rows.slice(1);if(data.length>8000)throw Error('Import limité à 8 000 lignes.');const guess=word=>Math.max(0,headers.findIndex(h=>word.test(h.toLowerCase())));const opts=(sel,none=false)=>(none?'<option value="">Aucune colonne</option>':'')+headers.map((h,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(h)}</option>`).join('');
 openModal('Un relevé, à votre façon',`<p class="inline-note" style="margin:0 0 18px">${esc(file.name)} · ${data.length} lignes. Associez les colonnes, puis vérifiez l’aperçu.</p><div class="form-grid">${selectField('Colonne date','colDate',opts(guess(/date/)))}${selectField('Colonne libellé','colDesc',opts(guess(/description|libell|label|motif/)))}${selectField('Colonne montant','colAmount',opts(guess(/montant|amount|valeur/)))}${selectField('Colonne type (facultative)','colType',opts(headers.findIndex(h=>/type|sens/i.test(h)),true))}${selectField('Colonne catégorie (facultative)','colCat',opts(headers.findIndex(h=>/cat.g/i.test(h)),true))}${selectField('Compte destinataire','accountId',accountOptions(state.accounts[0].id))}${selectField('Si aucun type n’est indiqué','signMode','<option value="signed">Montants négatifs = dépenses</option><option value="expense">Tous les montants = dépenses</option><option value="income">Tous les montants = revenus</option>')}</div><div id="csv-preview" class="import-preview"></div><div class="helper">Les virements doivent être saisis séparément entre deux comptes. La détection des doublons compare date, montant, sens, compte et libellé ; vérifiez les opérations réellement identiques.</div>`,'Vérifier puis importer',async fd=>{const entries=mapCSV(fd),existing=new Set(state.transactions.map(txKey)),seen=new Set(),fresh=[];let duplicates=0;for(const t of entries){const key=txKey(t);if(existing.has(key)||seen.has(key)){duplicates++;continue;}seen.add(key);fresh.push(t);}if(!fresh.length)throw Error('Aucune nouvelle opération à importer : les lignes existent déjà.');if(state.transactions.length+fresh.length>8000)throw Error('Le budget dépasserait 8 000 opérations.');if(!await confirmAction('Importer ces opérations ?',`${fresh.length} nouvelles opérations seront ajoutées. ${duplicates} doublon(s) seront ignorés. Les catégories absentes seront classées dans « Autres » ou « Revenus ».`,'Importer maintenant'))return false;mutate(s=>{s.transactions.push(...fresh);},fresh.length+' opérations importées.');return true;},{wide:true});
 function mapCSV(fd){return data.map((row,i)=>{try{let amount=C.parseMoney(row[Number(fd.get('colAmount'))]||'0'),type;const typ=fd.get('colType')!==''?(row[Number(fd.get('colType'))]||'').trim().toLowerCase():'';if(/transfer|virement/.test(typ))throw Error('Un virement demande un compte de destination : importez-le manuellement.');if(/income|revenu|crédit|credit|entrée|entree/.test(typ))type='income';else if(/expense|dépense|depense|débit|debit|sortie/.test(typ))type='expense';else type=fd.get('signMode')==='expense'?'expense':fd.get('signMode')==='income'?'income':amount<0?'expense':'income';amount=Math.abs(amount);if(!amount)throw Error('Montant nul.');const category=fd.get('colCat')!==''?(row[Number(fd.get('colCat'))]||'').trim():'';return {id:C.uid(),date:csvDate(row[Number(fd.get('colDate'))]||''),description:(row[Number(fd.get('colDesc'))]||'Import CSV').slice(0,160),amount,type,accountId:fd.get('accountId'),category:category.slice(0,70)||(type==='income'?'Revenus':'Autres'),note:''};}catch(e){throw Error('Ligne '+(i+2)+' : '+e.message);}});}
 function preview(){try{const entries=mapCSV(new FormData($('#modal-form')));$('#csv-preview').innerHTML=`<table class="data-table"><thead><tr><th>DATE</th><th>LIBELLÉ</th><th>MONTANT</th></tr></thead><tbody>${entries.slice(0,6).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.description)}</td><td>${t.type==='expense'?'−':'+'}${money(t.amount)}</td></tr>`).join('')}</tbody></table>`;}catch(e){$('#csv-preview').innerHTML=`<p class="inline-note" style="padding:12px;color:#b88772">${esc(e.message)}</p>`;}}
 $('#modal-form').addEventListener('change',preview);preview();});}
function txKey(t){return [t.date,t.type,t.amount,t.accountId,t.description.trim().toLowerCase().replace(/\s+/g,' ')].join('|');}
async function deleteEntity(key,id,title){const item=state[key].find(x=>x.id===id);if(!item)return;if(key==='accounts'){if(state.accounts.length<=1)throw Error('Conservez au moins un compte.');if(state.transactions.some(t=>t.accountId===id||t.toAccountId===id)||state.recurring.some(r=>r.accountId===id))throw Error('Ce compte est utilisé par des opérations ou des récurrences. Modifiez ces références avant de le supprimer.');}
 if(await confirmAction(title,'Cette suppression peut être annulée avec le bouton « Annuler » qui apparaîtra pendant quelques secondes.','Supprimer')){mutate(s=>{if(key==='transactions'&&item.debtId){const d=s.debts.find(d=>d.id===item.debtId);if(d)d.remaining+=item.amount;}s[key]=s[key].filter(x=>x.id!==id);},'Élément supprimé.');closeModal();}}
function goto(v){view=v;ui.menu=false;location.hash='/'+v;render();window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-view]');if(nav){goto(nav.dataset.view);return;}const range=e.target.closest('[data-range]');if(range){ui.chartRange=Number(range.dataset.range);render();return;}const tab=e.target.closest('[data-forecast-tab]');if(tab){ui.forecastTab=tab.dataset.forecastTab;render();return;}const a=e.target.closest('[data-action]');if(!a)return;const id=a.dataset.id;try{switch(a.dataset.action){case'menu':ui.menu=!ui.menu;render();break;case'privacy':ui.private=!ui.private;render();break;case'close-modal':closeModal();break;case'undo':if(lastUndo)lastUndo();$('#toast-root').innerHTML='';lastUndo=null;break;case'alerts':{const list=alerts();openModal('Vos points d’attention',list.length?`<div class="tip-list">${list.map(a=>`<div class="tip-card"><h3>${esc(a.title)}</h3><p>${esc(a.text)}</p></div>`).join('')}</div>`:empty('Rien de particulier à signaler','Continuez à mettre à jour vos comptes pour des repères utiles.','','','shield'),'C’est noté',()=>true);break;}case'transaction':transactionModal(id);break;case'account':accountModal(id);break;case'reconcile':reconcileModal(id);break;case'budget':budgetModal(id);break;case'goal':goalModal(id);break;case'fund-goal':fundGoal(id);break;case'release-goal':fundGoal(id,true);break;case'recurring':recurringModal(id);break;case'debt':debtModal(id);break;case'pay-debt':payDebt(id);break;case'record-recurring':{const r=state.recurring.find(x=>x.id===id);transactionModal(null,{type:r.type,amount:r.amount,description:r.name,accountId:r.accountId,category:r.category,recurringId:id,occurrence:a.dataset.date,date:C.iso()});break;}case'delete-transaction':await deleteEntity('transactions',id,'Supprimer cette opération ?');break;case'delete-account':await deleteEntity('accounts',id,'Supprimer ce compte ?');break;case'delete-budget':await deleteEntity('budgets',id,'Supprimer cette enveloppe ?');break;case'delete-goal':await deleteEntity('goals',id,'Supprimer ce projet et libérer sa réserve ?');break;case'delete-recurring':await deleteEntity('recurring',id,'Supprimer cette récurrence ?');break;case'delete-debt':await deleteEntity('debts',id,'Supprimer cette fiche ? Les opérations passées seront conservées.');break;case'page-prev':ui.page=Math.max(0,ui.page-1);render();break;case'page-next':ui.page++;render();break;case'goto-scenarios':goto('scenarios');break;case'reset-scenario':ui.purchase=0;ui.incomeDrop=0;ui.cut=0;render();break;case'export-json':exportJSON();break;case'export-csv':download('Luma-operations-'+ui.month+'.csv',C.csvExport(view==='transactions'?filteredTransactions():C.monthTransactions(state,ui.month)),'text/csv;charset=utf-8');break;case'import':importCSV();break;case'import-json':importJSON();break;case'print':window.print();break;case'real':realBudget();break;case'demo':realCache=C.clone(state);state=C.demoState();demo=true;render();break;case'retry':saveError='';queueSave();break;case'reset':if(await confirmAction('Repartir de zéro ?',`Le budget ${demo?'de démonstration':'personnel'} affiché sera remplacé par un compte vide. Vous pouvez annuler et exporter une copie avant de continuer.`,'Réinitialiser'))mutate(()=>{state=C.emptyState();},'Budget réinitialisé.');break;}}catch(err){toast(err.message);}});
document.addEventListener('submit',async e=>{if(e.target.id==='modal-form'){e.preventDefault();const handler=currentSubmit;if(!handler)return;const submit=e.target.querySelector('[type=submit]');submit.disabled=true;try{const done=await handler(new FormData(e.target));if(done!==false&&$('#modal-form')===e.target)closeModal();}catch(err){const box=$('#modal-error');if(box){box.textContent=err.message;box.classList.add('show');box.scrollIntoView({block:'nearest'});}else toast(err.message);}finally{if(submit.isConnected)submit.disabled=false;}}else if(e.target.id==='settings-form'){e.preventDefault();const fd=new FormData(e.target);try{mutate(s=>{s.settings.name=String(fd.get('name')).trim();if(!s.transactions.length)s.settings.currency=fd.get('currency')||s.settings.currency;const category=String(fd.get('category')||'').trim();if(category&&!cats().includes(category))s.settings.categories.push(category);},'Préférences enregistrées.');}catch(err){toast(err.message);}}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='period'){ui.month=e.target.value;ui.page=0;render();}if(id==='tx-type'||id==='tx-account'||id==='tx-category'){ui[id.slice(3)]=e.target.value;ui.page=0;render();}if(id==='forecast-days'){ui.days=Number(e.target.value);render();}if(id==='scenario-purchase'){try{ui.purchase=C.parseMoney(e.target.value);if(ui.purchase<0)throw Error('Le montant de l’achat doit être positif.');$('#scenario-output').innerHTML=scenarioOutput();}catch(err){ui.purchase=0;e.target.value='0';toast(err.message);}}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.id==='tx-search'){ui.search=e.target.value;ui.page=0;clearTimeout(searchTimer);searchTimer=setTimeout(render,180);}if(e.target.id==='scenario-income'||e.target.id==='scenario-cut'){const income=e.target.id==='scenario-income';ui[income?'incomeDrop':'cut']=Number(e.target.value);$(income?'#income-label':'#cut-label').textContent=e.target.value+' %';$('#scenario-output').innerHTML=scenarioOutput();}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#global-search')?.focus();}if(e.target.id==='global-search'&&e.key==='Enter'){ui.search=e.target.value;ui.page=0;goto('transactions');}if(e.key==='Escape'){closeModal();if(ui.menu){ui.menu=false;render();}}if(e.key==='Tab'&&$('#modal-form')){const focusable=[...$('#modal-root').querySelectorAll('button,input,select,textarea,a')].filter(el=>!el.disabled&&!el.closest('[hidden]'));const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal();});
function tipShow(el,event){const wrap=el.closest('.chart-shell');if(!wrap)return;const tip=wrap.querySelector('.chart-tip');tip.textContent=el.dataset.tip;const box=wrap.getBoundingClientRect(),rect=el.getBoundingClientRect();tip.style.left=Math.max(90,Math.min(box.width-90,(event?.clientX||rect.x+rect.width/2)-box.x))+'px';tip.style.top=Math.max(30,(event?.clientY||rect.y)-box.y-12)+'px';tip.classList.add('show');}
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(el)tipShow(el,e);});document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]'))document.querySelectorAll('.chart-tip').forEach(t=>t.classList.remove('show'));});document.addEventListener('focusin',e=>{if(e.target.dataset.tip)tipShow(e.target);});document.addEventListener('focusout',e=>{if(e.target.dataset.tip)document.querySelectorAll('.chart-tip').forEach(t=>t.classList.remove('show'));});
window.addEventListener('hashchange',()=>{const v=location.hash.replace('#/','');if(views[v]&&v!==view){view=v;render();}});window.addEventListener('beforeunload',e=>{if(!demo&&(saving||queued||saveStatus==='error')){e.preventDefault();e.returnValue='';}});
render();load();
</script></body></html>
